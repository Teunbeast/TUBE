<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube — homepage</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{--bg:#fff;--ink:#18384a;--muted:#6f8794;--line:#dfe8ec;--accent:#4f8993;--shadow:0 16px 44px rgba(24,56,74,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}.shell{min-height:100vh}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,76px)}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:650;letter-spacing:-.03em}.brandmark{width:26px;height:26px;border-radius:9px 3px 9px 3px;background:linear-gradient(135deg,#92c2c8,#5f99a4);position:relative;overflow:hidden}.brandmark:after{content:"";position:absolute;width:34px;height:1px;left:-4px;top:12px;background:rgba(255,255,255,.8);transform:rotate(-42deg)}
.login{border:0;background:transparent;font-size:14px;font-weight:560;padding:10px 0;cursor:pointer}
.hero{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px 72px}
h1{margin:0 0 34px;font-size:clamp(42px,4.15vw,62px);line-height:1.08;letter-spacing:-.045em;font-weight:520;text-align:center}h1 .accent{color:var(--accent)}
.search-stack{width:min(760px,90vw);position:relative}.search{width:100%;display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 9px 8px 24px;background:#fff;border:1px solid #e6edef;border-radius:36px;box-shadow:var(--shadow)}
.search svg{width:21px;height:21px;flex:0 0 auto;color:#7292a1}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}.search input::placeholder{color:#94a9b4}.search button{height:50px;min-width:92px;padding:0 20px;border:0;border-radius:27px;background:var(--ink);color:#fff;font-size:14px;font-weight:620;cursor:pointer}
.suggestions{width:100%;margin-top:12px;border:1px solid #e4ebee;border-radius:20px;background:#fff;box-shadow:0 18px 42px rgba(24,56,74,.08);overflow:hidden;display:none}.suggestions.visible{display:block}.suggestion-label{padding:12px 18px 8px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#8aa0ab}
.suggestion{width:100%;min-height:58px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:12px 18px;border:0;border-top:1px solid #eef3f4;background:#fff;text-align:left;cursor:pointer}.suggestion:hover{background:#f8fbfb}.suggestion-name{display:block;font-size:14px;font-weight:640;margin-bottom:3px}.suggestion-reason{font-size:12px;color:var(--muted)}
.category-area{padding:4px 20px 64px}.category-toggle{margin:0 auto;display:flex;align-items:center;gap:11px;min-height:48px;padding:0 18px;border:1px solid #d6e1e5;border-radius:25px;background:#fff;font-size:14px;font-weight:560;cursor:pointer}.chevron{transition:transform .3s ease}.category-area.open .chevron{transform:rotate(180deg)}
.reveal{max-width:760px;margin:0 auto;display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.16,.86,.3,1),margin-top .55s cubic-bezier(.16,.86,.3,1)}.category-area.open .reveal{grid-template-rows:1fr;margin-top:28px}.clip{overflow:hidden}.panel{border:1px solid #e4ebee;border-radius:22px;background:#fff;box-shadow:0 22px 50px rgba(24,56,74,.07);padding:10px 18px 14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 4px 0 6px;border-bottom:1px solid #edf2f4}.panel-title{font-size:15px;font-weight:650}.close{width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:22px;cursor:pointer}
.list{display:flex;flex-direction:column}.item{width:100%;min-height:76px;display:grid;grid-template-columns:42px 1fr 24px;align-items:center;gap:15px;border:0;border-bottom:1px solid #edf2f4;background:#fff;text-align:left;padding:12px 6px;cursor:pointer}.item:last-child{border-bottom:0}.item:hover{background:#fafcfc}.iconwrap{width:38px;height:38px;border:1px solid #d9e5e9;border-radius:50%;display:grid;place-items:center;color:#517887;background:#fcfdfd}.copy{min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px}.name{font-size:14px;font-weight:640;white-space:nowrap}.name:after{content:" -"}.desc{font-size:12.5px;line-height:1.35;color:var(--muted)}.arrow{font-size:21px;color:#7c99a6}
@media(max-width:640px){header{height:72px}.brand{font-size:21px}.hero{min-height:390px;padding:52px 18px 58px}h1{font-size:39px}.search-stack{width:min(94vw,760px)}.search{padding-left:20px;min-height:64px}.search input{font-size:14px}.search button{min-width:74px;height:46px;padding:0 15px;font-size:13px}}

/* TUBE DESIGN EXPERIMENT 01 — rustig, warm en meer diepte */
body{
  background:
    radial-gradient(circle at 14% 18%,rgba(142,205,195,.23),transparent 31%),
    radial-gradient(circle at 86% 8%,rgba(180,205,230,.25),transparent 28%),
    linear-gradient(180deg,#f7fbfa 0%,#fffdf9 54%,#f7fafb 100%);
  background-attachment:fixed;
}
header{
  background:rgba(248,252,251,.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(211,226,226,.55);
}
.brandmark{
  background:linear-gradient(135deg,#8fd3c6,#4f8993 62%,#315e70);
  box-shadow:0 8px 22px rgba(79,137,147,.20);
}
.hero{position:relative}
.hero:before{
  content:"";position:absolute;width:min(560px,72vw);height:min(330px,48vw);
  border-radius:50%;background:rgba(196,225,218,.22);filter:blur(70px);
  z-index:-1;top:18%;left:50%;transform:translateX(-50%);
}
h1{color:#153746;text-shadow:0 1px 0 rgba(255,255,255,.7)}
h1 .accent{color:#3f8b83}
.search{
  background:rgba(255,255,255,.88);
  border-color:rgba(195,215,216,.82);
  box-shadow:0 20px 55px rgba(40,79,87,.12),0 2px 10px rgba(40,79,87,.04);
  backdrop-filter:blur(14px);
}
.search:focus-within{
  border-color:#8bb9b5;
  box-shadow:0 22px 58px rgba(40,79,87,.14),0 0 0 4px rgba(79,137,147,.07);
}
.search button{background:linear-gradient(135deg,#244b5c,#18384a)}
.category-toggle{
  background:rgba(255,255,255,.72);border-color:rgba(190,211,213,.9);
  box-shadow:0 10px 30px rgba(36,74,84,.06);backdrop-filter:blur(12px)
}
.panel,.suggestions{
  background:rgba(255,255,255,.92);
  border-color:rgba(205,221,222,.88);
  box-shadow:0 24px 60px rgba(35,72,82,.10);
  backdrop-filter:blur(16px)
}
.item,.suggestion{background:transparent}
.item:hover,.suggestion:hover{background:rgba(235,246,244,.68)}
.iconwrap{background:linear-gradient(145deg,#fbfefd,#edf6f4);border-color:#cee0df;color:#477d7c}



/* TUBE THEME SWITCH */
.header-left{display:flex;align-items:center;gap:14px}
.theme-switch{
  display:flex;align-items:center;gap:3px;padding:3px;
  border:1px solid rgba(111,135,145,.20);border-radius:18px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(10px)
}
.theme-choice{
  height:30px;padding:0 10px;border:0;border-radius:14px;background:transparent;
  color:#6c7f89;font-size:11.5px;font-weight:650;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .18s ease,color .18s ease,box-shadow .18s ease
}
html[data-theme="day"] .theme-choice[data-theme-choice="day"]{
  background:#fff;color:#18384a;box-shadow:0 4px 14px rgba(24,56,74,.09)
}
html[data-theme="night"] .theme-switch{
  background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .theme-choice{color:#8f97a6}
html[data-theme="night"] .theme-choice[data-theme-choice="night"]{
  color:#fff;background:linear-gradient(135deg,rgba(109,75,255,.88),rgba(42,168,255,.78));
  box-shadow:0 5px 16px rgba(77,103,255,.22)
}
@media(max-width:640px){
  .header-left{gap:9px}.theme-label{display:none}.theme-choice{width:31px;padding:0;justify-content:center}
}


/* TUBE NIGHT MODE — paarse focusstijl */
html[data-theme="night"] body{
  background:
    radial-gradient(circle at 78% 12%,rgba(111,70,255,.25),transparent 28%),
    radial-gradient(circle at 18% 22%,rgba(47,112,255,.18),transparent 30%),
    radial-gradient(circle at 50% 115%,rgba(0,174,255,.10),transparent 36%),
    linear-gradient(180deg,#0a0b10 0%,#0d0f15 48%,#0b0d12 100%);
  color:#f5f7fb;background-attachment:fixed
}
html[data-theme="night"] .shell{position:relative;overflow:hidden}
html[data-theme="night"] .shell:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 24%),radial-gradient(circle at 50% 32%,rgba(255,255,255,.03),transparent 32%)
}
html[data-theme="night"] header{
  background:rgba(10,11,16,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06)
}
html[data-theme="night"] .brand{color:#fff;font-weight:720}
html[data-theme="night"] .brandmark{
  background:linear-gradient(145deg,#6f46ff 0%,#4d7cff 48%,#28b8ff 100%);
  box-shadow:0 0 28px rgba(92,91,255,.35)
}
html[data-theme="night"] .login{
  color:#f4f6fb;border:1px solid rgba(255,255,255,.12);
  padding:10px 15px;border-radius:18px;background:rgba(255,255,255,.045)
}
html[data-theme="night"] .hero{min-height:560px;padding:74px 20px 86px;position:relative}
html[data-theme="night"] .hero:before{
  content:"";position:absolute;width:min(760px,84vw);height:min(440px,54vw);border-radius:50%;
  background:radial-gradient(circle at 58% 44%,rgba(120,68,255,.28),transparent 40%),radial-gradient(circle at 35% 58%,rgba(42,127,255,.20),transparent 44%);
  filter:blur(34px);z-index:-1;top:9%;left:50%;transform:translateX(-50%)
}
html[data-theme="night"] h1{
  color:#fff;font-size:clamp(48px,5.4vw,78px);line-height:.98;letter-spacing:-.052em;
  font-weight:760;text-shadow:none;margin-bottom:38px
}
html[data-theme="night"] h1 .accent{
  color:#fff;background:linear-gradient(90deg,#ffffff 15%,#bfc8ff 48%,#8dbdff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}
html[data-theme="night"] .search-stack{width:min(790px,92vw)}
html[data-theme="night"] .search{
  min-height:72px;background:rgba(28,30,38,.92);border:1px solid rgba(255,255,255,.10);
  box-shadow:0 24px 70px rgba(0,0,0,.34),0 0 0 1px rgba(115,100,255,.05);backdrop-filter:blur(20px)
}
html[data-theme="night"] .search:focus-within{
  border-color:rgba(110,126,255,.55);box-shadow:0 26px 74px rgba(0,0,0,.38),0 0 0 4px rgba(90,100,255,.10)
}
html[data-theme="night"] .search svg{color:#8d96a8}
html[data-theme="night"] .search input{color:#f6f8fc;font-size:16px}
html[data-theme="night"] .search input::placeholder{color:#7f8796}
html[data-theme="night"] .search button{
  min-width:106px;background:linear-gradient(135deg,#6d4bff 0%,#4e72ff 55%,#2aa8ff 100%);
  box-shadow:0 10px 28px rgba(77,103,255,.28)
}
html[data-theme="night"] .category-area{padding-top:0}
html[data-theme="night"] .category-toggle{
  color:#f2f5fa;background:rgba(26,28,35,.88);border:1px solid rgba(255,255,255,.09);
  box-shadow:0 14px 42px rgba(0,0,0,.24);backdrop-filter:blur(18px)
}
html[data-theme="night"] .panel,
html[data-theme="night"] .suggestions{
  background:rgba(18,20,26,.96);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 26px 74px rgba(0,0,0,.35);backdrop-filter:blur(20px)
}
html[data-theme="night"] .panel-head{border-bottom-color:rgba(255,255,255,.07)}
html[data-theme="night"] .panel-title,
html[data-theme="night"] .suggestion-name,
html[data-theme="night"] .name{color:#f5f7fb}
html[data-theme="night"] .close{color:#aab2c0}
html[data-theme="night"] .suggestion-label{color:#777f91}
html[data-theme="night"] .list{gap:10px;padding:10px 0 0}
html[data-theme="night"] .item,
html[data-theme="night"] .suggestion{
  color:#eef2f8;background:#171920;border:1px solid rgba(255,255,255,.055);border-radius:15px
}
html[data-theme="night"] .item{min-height:70px;padding:12px 12px}
html[data-theme="night"] .suggestion{margin:8px 10px;width:calc(100% - 20px);border-top:1px solid rgba(255,255,255,.055)}
html[data-theme="night"] .item:last-child{border-bottom:1px solid rgba(255,255,255,.055)}
html[data-theme="night"] .item:hover,
html[data-theme="night"] .suggestion:hover{background:#1e2129;border-color:rgba(103,122,255,.26)}
html[data-theme="night"] .iconwrap{
  color:#aab8ff;background:linear-gradient(145deg,#202333,#171a25);border-color:rgba(114,124,255,.18)
}
html[data-theme="night"] .desc,
html[data-theme="night"] .suggestion-reason{color:#8f97a6}
html[data-theme="night"] .arrow{color:#8893ab}
@media(max-width:640px){
  html[data-theme="night"] .hero{min-height:500px;padding-top:64px}
  html[data-theme="night"] h1{font-size:46px}
  html[data-theme="night"] .search{min-height:66px}
}


/* OWSY portal */
.portal-actions{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.owsy-toggle{
  display:flex;align-items:center;gap:9px;min-height:48px;padding:0 18px;
  border:1px solid #d6e1e5;border-radius:25px;background:rgba(255,255,255,.72);
  color:var(--ink);font-size:14px;font-weight:650;letter-spacing:.045em;cursor:pointer;
  box-shadow:0 10px 30px rgba(36,74,84,.06);backdrop-filter:blur(12px);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.owsy-toggle:hover{transform:translateY(-1px);border-color:#b9ccd3;box-shadow:0 14px 34px rgba(36,74,84,.09)}
.owsy-dot{
  width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,#6d4bff,#2aa8ff);
  box-shadow:0 0 14px rgba(90,100,255,.42);
}
html[data-theme="night"] .owsy-toggle{
  color:#f2f5fa;background:rgba(26,28,35,.88);
  border-color:rgba(255,255,255,.09);
  box-shadow:0 14px 42px rgba(0,0,0,.24)
}
html[data-theme="night"] .owsy-toggle:hover{
  border-color:rgba(111,116,255,.34);
  box-shadow:0 16px 46px rgba(0,0,0,.28),0 0 28px rgba(86,87,255,.09)
}
.owsy-transition{
  position:fixed;inset:0;z-index:999;display:grid;place-items:center;
  opacity:0;visibility:hidden;pointer-events:none;
  background:rgba(6,7,12,.30);
  backdrop-filter:blur(0px) brightness(1);
  -webkit-backdrop-filter:blur(0px) brightness(1);
  transition:opacity .34s ease,visibility .34s ease,backdrop-filter .65s cubic-bezier(.2,.8,.2,1);
}
.owsy-transition.active{
  opacity:1;visibility:visible;pointer-events:auto;
  backdrop-filter:blur(18px) brightness(.36);
  -webkit-backdrop-filter:blur(18px) brightness(.36);
}
.portal-stage{position:relative;width:min(430px,82vw);aspect-ratio:1;display:grid;place-items:center;transform:scale(.74);opacity:.2;transition:transform .78s cubic-bezier(.16,.9,.2,1),opacity .36s ease}
.owsy-transition.active .portal-stage{transform:scale(1);opacity:1}
.portal-ring{
  position:absolute;border-radius:50%;border:1px solid rgba(181,192,255,.13);
  background:rgba(255,255,255,.018);
  box-shadow:inset 0 0 40px rgba(108,77,255,.025);
  transform:scale(.55);opacity:0;
}
.portal-ring:nth-child(1){width:100%;height:100%;transition:transform .9s .03s ease,opacity .5s .03s ease}
.portal-ring:nth-child(2){width:78%;height:78%;transition:transform .82s .08s ease,opacity .5s .08s ease}
.portal-ring:nth-child(3){width:56%;height:56%;transition:transform .76s .13s ease,opacity .5s .13s ease}
.portal-ring:nth-child(4){width:36%;height:36%;transition:transform .7s .18s ease,opacity .5s .18s ease}
.owsy-transition.active .portal-ring{transform:scale(1);opacity:1}
.portal-core{
  position:relative;z-index:2;width:112px;height:112px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-size:16px;font-weight:760;letter-spacing:.16em;
  background:radial-gradient(circle at 35% 30%,rgba(159,137,255,.78),rgba(86,72,226,.72) 38%,rgba(20,25,43,.92) 78%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 52px rgba(92,91,255,.32),0 24px 70px rgba(0,0,0,.34);
}
.portal-caption{
  position:absolute;top:calc(50% + 88px);left:50%;transform:translateX(-50%);
  color:rgba(247,249,255,.78);font-size:12px;letter-spacing:.10em;text-transform:uppercase;white-space:nowrap;
  opacity:0;transition:opacity .45s .28s ease
}
.owsy-transition.active .portal-caption{opacity:1}
@media(max-width:640px){
  .portal-actions{gap:8px}.category-toggle,.owsy-toggle{padding:0 14px;min-height:46px}
}

</style>
</head>
<body>
<div class="shell">
<header>
  <div class="header-left">
<div class="brand"><div class="brandmark"></div><span>Tube</span></div>
<div class="theme-switch" aria-label="Weergavemodus">
  <button class="theme-choice" type="button" data-theme-choice="day" aria-label="Overdagmodus"><span>☀</span><span class="theme-label">Overdag</span></button>
  <button class="theme-choice" type="button" data-theme-choice="night" aria-label="Nachtmodus"><span>☾</span><span class="theme-label">Nacht</span></button>
</div>
</div>
  <button class="login">Inloggen</button>
</header>
<main>
<section class="hero">
  <h1>Wat wil je <span class="accent">vandaag</span> leren?</h1>
  <div class="search-stack">
    <form class="search" id="searchForm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.1 4.1"/></svg>
      <input id="searchInput" placeholder="Zoek een onderwerp of vaardigheid" autocomplete="off">
      <button type="submit">Zoeken</button>
    </form>
    <div class="suggestions" id="suggestions"></div>
  </div>
</section>

<section class="category-area" id="categoryArea">
  <div class="portal-actions">
    <button class="category-toggle" id="categoryToggle" type="button">
      <span>▦</span><span>Categorieën</span><span class="chevron">⌄</span>
    </button>
    <button class="owsy-toggle" id="owsyBtn" type="button" aria-label="Open OWSY">
      <span class="owsy-dot"></span><span>OWSY</span>
    </button>
  </div>
  <div class="reveal"><div class="clip"><div class="panel">
    <div class="panel-head"><div class="panel-title">Alle categorieën</div><button class="close" id="closeCategories">×</button></div>
    <div class="list" id="categoryList"></div>
  </div></div></div>
</section>
</main>
</div>

<div class="owsy-transition" id="owsyTransition" aria-hidden="true">
  <div class="portal-stage">
    <div class="portal-ring"></div>
    <div class="portal-ring"></div>
    <div class="portal-ring"></div>
    <div class="portal-ring"></div>
    <div class="portal-core">OWSY</div>
    <div class="portal-caption">De wereld opent</div>
  </div>
</div>

<script src="categories.js"></script>
<script>
const area=document.getElementById('categoryArea');
const toggle=document.getElementById('categoryToggle');
const closeBtn=document.getElementById('closeCategories');
const list=document.getElementById('categoryList');
const input=document.getElementById('searchInput');
const suggestions=document.getElementById('suggestions');
const owsyBtn=document.getElementById('owsyBtn');
const owsyTransition=document.getElementById('owsyTransition');

function categoryUrl(slug){return `category.html?cat=${encodeURIComponent(slug)}`}

function renderCategories(){
  list.innerHTML=window.TUBE_CATEGORIES.map((cat,i)=>`
    <button class="item" type="button" onclick="location.href='${categoryUrl(cat.slug)}'">
      <span class="iconwrap">${i+1}</span>
      <span class="copy"><span class="name">${cat.name}</span><span class="desc">${cat.description}</span></span>
      <span class="arrow">→</span>
    </button>`).join('');
}
renderCategories();

toggle.addEventListener('click',()=>area.classList.toggle('open'));
closeBtn.addEventListener('click',()=>area.classList.remove('open'));

function norm(v){return v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

function getCustomSubcategories(cat){
  try{
    return JSON.parse(localStorage.getItem(`tube-custom-subcategories:${cat.slug}`) || '[]');
  }catch(e){
    return [];
  }
}

input.addEventListener('input',()=>{
  const q=norm(input.value.trim());
  if(q.length<2){suggestions.classList.remove('visible');suggestions.innerHTML='';return}

  const matches=window.TUBE_CATEGORIES.filter(cat=>{
    const customSubs=getCustomSubcategories(cat);
    const hay=norm(JSON.stringify({category:cat,customSubcategories:customSubs}));
    return q.split(/\s+/).some(t=>t.length>1 && hay.includes(t));
  }).slice(0,3);

  if(!matches.length){suggestions.classList.remove('visible');suggestions.innerHTML='';return}

  suggestions.innerHTML=`<div class="suggestion-label">Relevante categorieën</div>`+matches.map(cat=>`
    <button class="suggestion" onclick="location.href='${categoryUrl(cat.slug)}'">
      <span><span class="suggestion-name">${cat.name}</span><span class="suggestion-reason">${cat.description}</span></span><span>→</span>
    </button>`).join('');
  suggestions.classList.add('visible');
});
document.getElementById('searchForm').addEventListener('submit',e=>e.preventDefault());
document.addEventListener('click',e=>{if(!e.target.closest('.search-stack'))suggestions.classList.remove('visible')});

owsyBtn.addEventListener('click',()=>{
  if(owsyTransition.classList.contains('active')) return;
  area.classList.remove('open');
  suggestions.classList.remove('visible');
  owsyTransition.classList.add('active');
  owsyTransition.setAttribute('aria-hidden','false');
  sessionStorage.setItem('tube-owsy-enter','1');
  setTimeout(()=>{ location.href='owsy.html'; },900);
});
</script>
<script>
(function(){
  const buttons=document.querySelectorAll('[data-theme-choice]');
  function setTheme(theme){
    document.documentElement.setAttribute('data-theme',theme);
    localStorage.setItem('tube-theme',theme);
    buttons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.themeChoice===theme)));
  }
  buttons.forEach(btn=>btn.addEventListener('click',()=>setTheme(btn.dataset.themeChoice)));
  setTheme(document.documentElement.getAttribute('data-theme') || 'night');
})();
</script>
</body>
</html>
