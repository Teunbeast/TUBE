<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube — leerjaar</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{--ink:#18384a;--muted:#708995;--line:#e4ebee;--soft:#f8fbfb;--accent:#4f8993}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5vw,72px);border-bottom:1px solid #f0f3f4}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:650;letter-spacing:-.03em;cursor:pointer}.brandmark{width:26px;height:26px;border-radius:9px 3px 9px 3px;background:linear-gradient(135deg,#92c2c8,#5f99a4)}
.back{border:1px solid #d8e4e8;background:#fff;border-radius:24px;padding:10px 15px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:64px 24px 90px}.crumb{font-size:12px;color:#7b96a2;margin-bottom:20px}.crumb button{border:0;background:transparent;padding:0;color:#668795;cursor:pointer}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:#7795a3;margin-bottom:16px}
h1{font-size:clamp(38px,5vw,58px);line-height:1.05;letter-spacing:-.045em;font-weight:520;margin:0 0 14px}
.intro{font-size:15px;line-height:1.6;color:var(--muted);margin-bottom:42px;max-width:680px}
.levels{border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 46px rgba(24,56,74,.06)}
.level{display:grid;grid-template-columns:1fr 26px;align-items:center;gap:18px;min-height:96px;padding:22px 24px;border-bottom:1px solid #edf2f4;cursor:pointer}.level:last-child{border-bottom:0}.level:hover{background:var(--soft)}
.level-name{font-size:17px;font-weight:680;margin-bottom:6px}.level-desc{font-size:13px;line-height:1.45;color:var(--muted)}.arrow{font-size:23px;color:#7896a3}

/* TUBE DESIGN EXPERIMENT 01 */
body{
  background:
    radial-gradient(circle at 10% 12%,rgba(142,205,195,.18),transparent 27%),
    radial-gradient(circle at 90% 4%,rgba(180,205,230,.20),transparent 26%),
    linear-gradient(180deg,#f8fbfa 0%,#fffdf9 58%,#f7fafb 100%);
  background-attachment:fixed;
}
header{background:rgba(248,252,251,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom-color:rgba(211,226,226,.6)}
.brandmark{background:linear-gradient(135deg,#8fd3c6,#4f8993 62%,#315e70);box-shadow:0 8px 22px rgba(79,137,147,.20)}
.eyebrow{color:#4f8993}.levels{background:rgba(255,255,255,.9);border-color:rgba(205,221,222,.9);box-shadow:0 24px 60px rgba(35,72,82,.09);backdrop-filter:blur(14px)}
.level:hover{background:rgba(235,246,244,.7)}.back{background:rgba(255,255,255,.76);backdrop-filter:blur(10px)}


/* TUBE THEME SWITCH */
.header-left{display:flex;align-items:center;gap:14px}
.theme-switch{
  display:flex;align-items:center;gap:3px;padding:3px;
  border:1px solid rgba(111,135,145,.20);border-radius:18px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(10px)
}
.theme-choice{
  height:30px;padding:0 10px;border:0;border-radius:14px;background:transparent;
  color:#6c7f89;font-size:11.5px;font-weight:650;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .18s ease,color .18s ease,box-shadow .18s ease
}
html[data-theme="day"] .theme-choice[data-theme-choice="day"]{
  background:#fff;color:#18384a;box-shadow:0 4px 14px rgba(24,56,74,.09)
}
html[data-theme="night"] .theme-switch{
  background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .theme-choice{color:#8f97a6}
html[data-theme="night"] .theme-choice[data-theme-choice="night"]{
  color:#fff;background:linear-gradient(135deg,rgba(109,75,255,.88),rgba(42,168,255,.78));
  box-shadow:0 5px 16px rgba(77,103,255,.22)
}
@media(max-width:640px){
  .header-left{gap:9px}.theme-label{display:none}.theme-choice{width:31px;padding:0;justify-content:center}
}


/* TUBE NIGHT MODE — paarse focusstijl */
html[data-theme="night"] body{
  background:
    radial-gradient(circle at 82% 8%,rgba(111,70,255,.22),transparent 27%),
    radial-gradient(circle at 12% 16%,rgba(47,112,255,.15),transparent 28%),
    linear-gradient(180deg,#0a0b10 0%,#0d0f15 52%,#0b0d12 100%);
  color:#f5f7fb;background-attachment:fixed
}
html[data-theme="night"] header{
  background:rgba(10,11,16,.70);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom-color:rgba(255,255,255,.06)
}
html[data-theme="night"] .brand{color:#fff}
html[data-theme="night"] .brandmark{
  background:linear-gradient(145deg,#6f46ff 0%,#4d7cff 48%,#28b8ff 100%);
  box-shadow:0 0 28px rgba(92,91,255,.35)
}
html[data-theme="night"] h1,
html[data-theme="night"] .title,
html[data-theme="night"] .section-title,
html[data-theme="night"] .subname,
html[data-theme="night"] .level-name,
html[data-theme="night"] .phase-name,
html[data-theme="night"] .video-title,
html[data-theme="night"] .panel-title{color:#f5f7fb}
html[data-theme="night"] .eyebrow,
html[data-theme="night"] .kicker{color:#aab8ff}
html[data-theme="night"] .intro,
html[data-theme="night"] .subdesc,
html[data-theme="night"] .level-desc,
html[data-theme="night"] .phase-desc,
html[data-theme="night"] .desc,
html[data-theme="night"] .video-meta,
html[data-theme="night"] .crumb,
html[data-theme="night"] .crumbs,
html[data-theme="night"] .helper,
html[data-theme="night"] .note-help{color:#8f97a6}
html[data-theme="night"] .sublist,
html[data-theme="night"] .levels,
html[data-theme="night"] .phase,
html[data-theme="night"] .video-card,
html[data-theme="night"] .panel,
html[data-theme="night"] .modal{
  background:rgba(20,22,29,.94);border-color:rgba(255,255,255,.075);
  box-shadow:0 22px 58px rgba(0,0,0,.28);backdrop-filter:blur(16px)
}
html[data-theme="night"] .sub,
html[data-theme="night"] .level,
html[data-theme="night"] .phase-head,
html[data-theme="night"] .topics,
html[data-theme="night"] .video-card,
html[data-theme="night"] .panel-head,
html[data-theme="night"] .toolbar,
html[data-theme="night"] .note-status{
  border-color:rgba(255,255,255,.07)
}
html[data-theme="night"] .sub:hover,
html[data-theme="night"] .level:hover,
html[data-theme="night"] .video-card:hover{background:#1b1e26}
html[data-theme="night"] .topic,
html[data-theme="night"] .transcript p,
html[data-theme="night"] .note-editor{color:#aeb6c3}
html[data-theme="night"] .topic{border-color:rgba(255,255,255,.06)}
html[data-theme="night"] .topic:before{background:#7586ff}
html[data-theme="night"] .back,
html[data-theme="night"] .add-sub,
html[data-theme="night"] .lessons,
html[data-theme="night"] .tool,
html[data-theme="night"] .language,
html[data-theme="night"] .btn-secondary{
  color:#eef2f8;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .btn-primary{
  background:linear-gradient(135deg,#6d4bff,#2aa8ff);border-color:transparent;color:#fff
}
html[data-theme="night"] .note,
html[data-theme="night"] .toolbar,
html[data-theme="night"] .note-status,
html[data-theme="night"] .phase-head{background:rgba(255,255,255,.035)}
html[data-theme="night"] .note{color:#9ba6b5;border-color:rgba(255,255,255,.07)}
html[data-theme="night"] .note code{background:#1b1e26;color:#c8d0dc}
html[data-theme="night"] .field input,
html[data-theme="night"] .field textarea{
  color:#f2f5fa;background:#15171d;border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .thumb,
html[data-theme="night"] .player{
  border-color:rgba(255,255,255,.08);
  background:radial-gradient(circle at 70% 30%,rgba(111,70,255,.26),transparent 28%),linear-gradient(145deg,#171a26,#202334 58%,#151821)
}
html[data-theme="night"] .player-label,
html[data-theme="night"] .video-number,
html[data-theme="night"] .time{color:#8f97a6}
html[data-theme="night"] .arrow{color:#8994ad}

</style>
</head>
<body>
<header>
<div class="header-left">
<div class="brand" onclick="location.href='index.html'"><div class="brandmark"></div><span>Tube</span></div>
<div class="theme-switch" aria-label="Weergavemodus">
  <button class="theme-choice" type="button" data-theme-choice="day" aria-label="Overdagmodus"><span>☀</span><span class="theme-label">Overdag</span></button>
  <button class="theme-choice" type="button" data-theme-choice="night" aria-label="Nachtmodus"><span>☾</span><span class="theme-label">Nacht</span></button>
</div>
</div>
<button class="back" id="backBtn">← Terug</button>
</header>
<main>
<div class="crumb"><button onclick="location.href='index.html'">Home</button> &nbsp;/&nbsp; <span id="catCrumb"></span> &nbsp;/&nbsp; <span id="subCrumb"></span></div>
<div class="eyebrow">Taal</div>
<h1 id="title"></h1>
<div class="intro" id="intro"></div>
<div class="levels" id="levels"></div>
</main>
<script src="categories.js"></script>
<script>
const params=new URLSearchParams(location.search);
const catSlug=params.get('cat');
const subName=params.get('sub');
const cat=window.TUBE_CATEGORIES.find(c=>c.slug===catSlug);
const sub=cat?.subcategories?.find(s=>s.name===subName);
document.getElementById('backBtn').onclick=()=>location.href=`category.html?cat=${encodeURIComponent(catSlug)}`;
document.getElementById('catCrumb').textContent=cat?.name || 'Categorie';
document.getElementById('subCrumb').textContent=sub?.name || 'Taal';
document.getElementById('title').textContent=sub?.name || 'Taal';
document.getElementById('intro').textContent=sub?.description || '';
document.title=`Tube — ${sub?.name || 'Taal'}`;

const levels=document.getElementById('levels');
const data=sub?.levels || [];
levels.innerHTML=data.map(level=>`
  <div class="level" tabindex="0" role="link"
    onclick="openLevel('${level.name.replaceAll("'","\\'")}')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLevel('${level.name.replaceAll("'","\\'")}')}">
    <div><div class="level-name">${level.name}</div><div class="level-desc">${level.description}</div></div>
    <div class="arrow">→</div>
  </div>
`).join('');

function openLevel(level){
  location.href=`phases.html?cat=${encodeURIComponent(catSlug)}&sub=${encodeURIComponent(subName)}&level=${encodeURIComponent(level)}`;
}
</script>
<script>
(function(){
  const buttons=document.querySelectorAll('[data-theme-choice]');
  function setTheme(theme){
    document.documentElement.setAttribute('data-theme',theme);
    localStorage.setItem('tube-theme',theme);
    buttons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.themeChoice===theme)));
  }
  buttons.forEach(btn=>btn.addEventListener('click',()=>setTheme(btn.dataset.themeChoice)));
  setTheme(document.documentElement.getAttribute('data-theme') || 'night');
})();
</script>
</body>
</html>
