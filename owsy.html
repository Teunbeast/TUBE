<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWSY — Tube</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{
  --ink:#18384a;--muted:#708995;
  --bg1:#f7fbfa;--bg2:#fffdf9;--glass:rgba(255,255,255,.72);
  --line:rgba(38,79,90,.12);--ui:#18384a;
}
html[data-theme="night"]{
  --bg1:#090a0f;--bg2:#0d0f16;--glass:rgba(14,16,23,.60);
  --line:rgba(255,255,255,.09);--ui:#f5f7fb;--muted:#8f97a6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;
  color:var(--ui);
  background:
    radial-gradient(circle at 78% 10%,rgba(112,71,255,.18),transparent 28%),
    radial-gradient(circle at 18% 22%,rgba(47,112,255,.14),transparent 30%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;
}
html[data-theme="day"] body{
  background:
    radial-gradient(circle at 82% 8%,rgba(174,190,255,.26),transparent 30%),
    radial-gradient(circle at 15% 20%,rgba(138,205,195,.20),transparent 30%),
    linear-gradient(180deg,#f6fbfa,#fffdf9 60%,#f6fafb);
}
.ambient{
  position:fixed;inset:-20%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 48%,rgba(92,91,255,.13),transparent 26%),
    radial-gradient(circle at 50% 52%,rgba(42,168,255,.07),transparent 40%);
  filter:blur(26px);
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  height:82px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,58px);
}
.back{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--glass);color:var(--ui);border-radius:22px;padding:9px 14px;
  cursor:pointer;backdrop-filter:blur(16px);font:inherit;font-size:13px;font-weight:650
}
.identity{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:760;letter-spacing:.20em}
.mode{
  border:1px solid var(--line);background:var(--glass);color:var(--ui);
  width:40px;height:40px;border-radius:50%;cursor:pointer;backdrop-filter:blur(16px);
  font-size:16px
}
.experience{position:fixed;inset:0;display:grid;place-items:center}
.globe-wrap{
  position:relative;width:min(76vw,820px);height:min(76vw,820px);max-height:76vh;
  min-width:320px;min-height:320px;
}
#globe{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
.globe-wrap:after{
  content:"";position:absolute;inset:11%;border-radius:50%;pointer-events:none;
  box-shadow:
    0 0 0 1px rgba(145,155,255,.08),
    0 0 62px rgba(87,84,255,.14),
    0 34px 90px rgba(0,0,0,.20);
}
.copy{
  position:fixed;left:50%;bottom:clamp(26px,5vh,54px);transform:translateX(-50%);
  z-index:12;text-align:center;width:min(620px,88vw);pointer-events:none
}
.copy h1{
  margin:0 0 8px;color:var(--ui);font-size:clamp(24px,3vw,38px);
  line-height:1.05;letter-spacing:-.035em;font-weight:650
}
.copy p{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.035em}
.hint{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;
  border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);
  color:var(--muted);font-size:11px
}
@media(max-width:640px){
  .topbar{height:68px;padding:0 16px}.identity{font-size:11px}
  .globe-wrap{width:94vw;height:94vw;max-height:68vh}.copy{bottom:22px}
  .copy h1{font-size:28px}
}
</style>
</head>
<body>
<div class="ambient"></div>

<div class="topbar">
  <button class="back" type="button" onclick="location.href='index.html'"><span>←</span><span>Tube</span></button>
  <div class="identity">OWSY</div>
  <button class="mode" id="modeBtn" type="button" aria-label="Wissel dag- en nachtmodus">◐</button>
</div>

<main class="experience">
  <div class="globe-wrap">
    <canvas id="globe" aria-label="Interactieve wereldbol"></canvas>
  </div>
</main>

<div class="copy">
  <h1>De wereld binnen handbereik.</h1>
  <p>Beweeg de bol. OWSY wordt een plek om de wereld te ontdekken.</p>
  <div class="hint">↔&nbsp; Sleep om te draaien</div>
</div>

<script>
const canvas=document.getElementById('globe');
const ctx=canvas.getContext('2d');
const modeBtn=document.getElementById('modeBtn');

let W=0,H=0,dpr=1,yaw=-0.48,pitch=0.14,targetYaw=yaw,targetPitch=pitch;
let dragging=false,lastX=0,lastY=0,zoom=1,lastTime=performance.now();

const continents=[
  [[-168,70],[-145,72],[-125,62],[-115,52],[-98,49],[-82,45],[-66,47],[-57,53],[-62,37],[-78,27],[-97,17],[-107,22],[-117,32],[-126,48],[-150,60],[-168,70]],
  [[-81,12],[-70,10],[-54,5],[-36,-6],[-42,-22],[-54,-35],[-67,-55],[-76,-41],[-71,-18],[-81,12]],
  [[-17,35],[2,37],[20,32],[34,29],[50,12],[43,-12],[32,-34],[18,-35],[5,-26],[-5,-5],[-17,15],[-17,35]],
  [[-10,36],[2,46],[15,55],[30,64],[55,70],[82,69],[110,63],[140,57],[170,49],[150,36],[130,23],[112,10],[95,17],[80,28],[62,32],[48,30],[35,40],[20,45],[-10,36]],
  [[68,24],[75,8],[88,21],[82,29],[68,24]],
  [[100,8],[113,2],[121,-8],[112,-8],[100,8]],
  [[112,-10],[131,-12],[153,-27],[146,-40],[119,-35],[112,-10]],
  [[-55,82],[-24,78],[-30,61],[-49,60],[-55,82]],
  [[130,33],[140,43],[145,38],[139,31],[130,33]]
];

function theme(){
  return document.documentElement.getAttribute('data-theme') || 'night';
}
function palette(){
  if(theme()==='day'){
    return {
      sphere:['rgba(225,236,244,.50)','rgba(198,213,232,.17)'],
      grid:'rgba(66,98,123,.16)',
      coast:'rgba(75,86,205,.72)',
      glow:'rgba(89,91,236,.22)',
      rim:'rgba(73,104,186,.46)',
      dots:'rgba(54,112,205,.28)'
    };
  }
  return {
    sphere:['rgba(60,67,112,.36)','rgba(20,24,42,.20)'],
    grid:'rgba(143,155,255,.17)',
    coast:'rgba(151,161,255,.88)',
    glow:'rgba(86,78,255,.30)',
    rim:'rgba(131,151,255,.62)',
    dots:'rgba(65,183,255,.34)'
  };
}

function resize(){
  const rect=canvas.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);
  W=rect.width;H=rect.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function xyz(lon,lat){
  const a=lon*Math.PI/180,b=lat*Math.PI/180;
  return [Math.cos(b)*Math.sin(a),Math.sin(b),Math.cos(b)*Math.cos(a)];
}
function rotate(p){
  let [x,y,z]=p;
  let cy=Math.cos(yaw),sy=Math.sin(yaw);
  let x1=x*cy+z*sy,z1=-x*sy+z*cy;
  let cp=Math.cos(pitch),sp=Math.sin(pitch);
  let y1=y*cp-z1*sp,z2=y*sp+z1*cp;
  return [x1,y1,z2];
}
function project(p,r){
  const [x,y,z]=rotate(p);
  return [W/2+x*r,H/2-y*r,z];
}
function linePath(points,r,color,width,alphaBack=.08){
  let started=false,prevVisible=false;
  ctx.beginPath();
  for(const pair of points){
    const q=project(xyz(pair[0],pair[1]),r);
    const visible=q[2]>-0.02;
    if(visible){
      if(!started||!prevVisible){ctx.moveTo(q[0],q[1]);started=true}else ctx.lineTo(q[0],q[1]);
    }
    prevVisible=visible;
  }
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function drawGrid(r,p){
  ctx.save();
  ctx.lineWidth=1;
  for(let lat=-60;lat<=60;lat+=20){
    const pts=[];
    for(let lon=-180;lon<=180;lon+=4) pts.push([lon,lat]);
    linePath(pts,r,p.grid,1);
  }
  for(let lon=-160;lon<180;lon+=20){
    const pts=[];
    for(let lat=-88;lat<=88;lat+=3) pts.push([lon,lat]);
    linePath(pts,r,p.grid,1);
  }
  ctx.restore();
}
function drawDots(r,p){
  ctx.save();
  ctx.fillStyle=p.dots;
  for(let lat=-70;lat<=70;lat+=10){
    for(let lon=-180;lon<180;lon+=12){
      const q=project(xyz(lon,lat),r);
      if(q[2]>.15){
        const size=.6+q[2]*1.05;
        ctx.globalAlpha=.18+q[2]*.32;
        ctx.beginPath();ctx.arc(q[0],q[1],size,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const p=palette();
  const r=Math.min(W,H)*.39*zoom;
  const cx=W/2,cy=H/2;

  ctx.save();
  ctx.shadowColor=p.glow;ctx.shadowBlur=48;
  const halo=ctx.createRadialGradient(cx-r*.26,cy-r*.32,r*.08,cx,cy,r);
  halo.addColorStop(0,p.sphere[0]);halo.addColorStop(.72,p.sphere[1]);halo.addColorStop(1,'rgba(5,8,16,.06)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  drawDots(r,p);
  drawGrid(r,p);
  ctx.shadowColor=p.glow;ctx.shadowBlur=12;
  continents.forEach(c=>linePath(c,r,p.coast,1.65));
  ctx.restore();

  const rim=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  rim.addColorStop(0,'rgba(255,255,255,.08)');
  rim.addColorStop(.35,p.rim);
  rim.addColorStop(.72,'rgba(72,190,255,.25)');
  rim.addColorStop(1,'rgba(255,255,255,.06)');
  ctx.strokeStyle=rim;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();

  ctx.strokeStyle=theme()==='night'?'rgba(116,99,255,.11)':'rgba(76,104,183,.10)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,r*1.045,0,Math.PI*2);ctx.stroke();
}
function animate(now){
  const dt=Math.min(32,now-lastTime);lastTime=now;
  if(!dragging) targetYaw+=dt*.000035;
  yaw+=(targetYaw-yaw)*.09;
  pitch+=(targetPitch-pitch)*.09;
  draw();requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

canvas.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  targetYaw+=dx*.006;
  targetPitch=Math.max(-1.05,Math.min(1.05,targetPitch+dy*.005));
});
function endDrag(e){dragging=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom=Math.max(.82,Math.min(1.14,zoom-e.deltaY*.00055));
},{passive:false});

modeBtn.addEventListener('click',()=>{
  const next=theme()==='night'?'day':'night';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tube-theme',next);
});

</script>
</body>
</html>
