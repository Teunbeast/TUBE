<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWSY — Tube</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{
  --ink:#18384a;--muted:#708995;
  --bg1:#f7fbfa;--bg2:#fffdf9;--glass:rgba(255,255,255,.72);
  --line:rgba(38,79,90,.12);--ui:#18384a;
}
html[data-theme="night"]{
  --bg1:#090a0f;--bg2:#0d0f16;--glass:rgba(14,16,23,.60);
  --line:rgba(255,255,255,.09);--ui:#f5f7fb;--muted:#8f97a6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;
  color:var(--ui);
  background:
    radial-gradient(circle at 78% 10%,rgba(112,71,255,.18),transparent 28%),
    radial-gradient(circle at 18% 22%,rgba(47,112,255,.14),transparent 30%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;
}
html[data-theme="day"] body{
  background:
    radial-gradient(circle at 82% 8%,rgba(174,190,255,.26),transparent 30%),
    radial-gradient(circle at 15% 20%,rgba(138,205,195,.20),transparent 30%),
    linear-gradient(180deg,#f6fbfa,#fffdf9 60%,#f6fafb);
}
.ambient{
  position:fixed;inset:-20%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 48%,rgba(92,91,255,.13),transparent 26%),
    radial-gradient(circle at 50% 52%,rgba(42,168,255,.07),transparent 40%);
  filter:blur(26px);
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  height:82px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,58px);
}
.back{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--glass);color:var(--ui);border-radius:22px;padding:9px 14px;
  cursor:pointer;backdrop-filter:blur(16px);font:inherit;font-size:13px;font-weight:650
}
.identity{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:760;letter-spacing:.20em}
.mode{
  border:1px solid var(--line);background:var(--glass);color:var(--ui);
  width:40px;height:40px;border-radius:50%;cursor:pointer;backdrop-filter:blur(16px);
  font-size:16px
}
.experience{position:fixed;inset:0;display:grid;place-items:center}
.globe-wrap{
  position:relative;width:min(76vw,820px);height:min(76vw,820px);max-height:76vh;
  min-width:320px;min-height:320px;
}
.nl-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nl-line{stroke:rgba(92,170,255,.42);stroke-width:1;vector-effect:non-scaling-stroke}
.nl-point{fill:rgba(104,184,255,.82);filter:drop-shadow(0 0 6px rgba(74,140,255,.6))}
.nl-label{
  position:absolute;z-index:8;min-width:196px;padding:10px 13px;border-radius:14px;
  border:1px solid rgba(126,176,255,.18);background:rgba(14,18,30,.72);
  color:#dce7ff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  text-align:left;cursor:pointer;opacity:0;pointer-events:none;
  transform:translate3d(0,0,0);transition:opacity .2s ease,border-color .2s ease,background .2s ease;
  box-shadow:0 10px 28px rgba(0,0,0,.18)
}
.nl-label.visible{opacity:1;pointer-events:auto}
.nl-label:hover{border-color:rgba(128,177,255,.34);background:rgba(18,23,39,.88)}
.nl-label strong{display:block;font-size:12.5px;font-weight:620;letter-spacing:.01em}
.nl-label span{display:block;margin-top:3px;color:rgba(194,206,232,.68);font-size:10.5px;letter-spacing:.055em;text-transform:uppercase}
html[data-theme="day"] .nl-label{background:rgba(255,255,255,.82);color:#27445c;border-color:rgba(79,137,147,.18)}
html[data-theme="day"] .nl-label span{color:#708995}

#globe{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
.globe-wrap:after{
  content:"";position:absolute;inset:11%;border-radius:50%;pointer-events:none;
  box-shadow:
    0 0 0 1px rgba(145,155,255,.08),
    0 0 62px rgba(87,84,255,.14),
    0 34px 90px rgba(0,0,0,.20);
}
.copy{
  position:fixed;left:50%;bottom:clamp(26px,5vh,54px);transform:translateX(-50%);
  z-index:12;text-align:center;width:min(620px,88vw);pointer-events:none
}
.copy h1{
  margin:0 0 8px;color:var(--ui);font-size:clamp(24px,3vw,38px);
  line-height:1.05;letter-spacing:-.035em;font-weight:650
}
.copy p{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.035em}
.hint{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;
  border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);
  color:var(--muted);font-size:11px
}
@media(max-width:640px){
  .topbar{height:68px;padding:0 16px}.identity{font-size:11px}
  .globe-wrap{width:94vw;height:94vw;max-height:68vh}.copy{bottom:22px}
  .copy h1{font-size:28px}
}
</style>
</head>
<body>
<div class="ambient"></div>

<div class="topbar">
  <button class="back" type="button" onclick="location.href='index.html'"><span>←</span><span>Tube</span></button>
  <div class="identity">OWSY</div>
  <button class="mode" id="modeBtn" type="button" aria-label="Wissel dag- en nachtmodus">◐</button>
</div>

<main class="experience">
  <div class="globe-wrap" id="globeWrap">
    <canvas id="globe" aria-label="Interactieve wereldbol"></canvas>
    <svg class="nl-overlay" id="nlOverlay" aria-hidden="true">
      <line class="nl-line" id="nlLine" x1="0" y1="0" x2="0" y2="0"></line>
      <circle class="nl-point" id="nlPoint" cx="0" cy="0" r="2.8"></circle>
    </svg>
    <button class="nl-label" id="nlLabel" type="button" aria-label="Open Nederland">
      <strong>Groep 7–8 · St. Jacobusschool</strong>
      <span>Nederland openen →</span>
    </button>
  </div>
</main>

<div class="copy">
  <h1>De wereld binnen handbereik.</h1>
  <p>Beweeg de bol. OWSY wordt een plek om de wereld te ontdekken.</p>
  <div class="hint">↔&nbsp; Sleep om te draaien</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const canvas=document.getElementById('globe');
const ctx=canvas.getContext('2d');
const modeBtn=document.getElementById('modeBtn');
const globeWrap=document.getElementById('globeWrap');
const nlOverlay=document.getElementById('nlOverlay');
const nlLine=document.getElementById('nlLine');
const nlPoint=document.getElementById('nlPoint');
const nlLabel=document.getElementById('nlLabel');

let W=0,H=0,dpr=1;
let dragging=false,lastX=0,lastY=0;
let rotation=[-12,-10,0];
let targetRotation=[...rotation];
let zoom=1;
let targetZoom=1;
let lastTime=performance.now();
let countryFeatures=[];
let netherlandsFeature=null;
let worldReady=false;
let pointerStart=null;
const netherlandsCentroid=[5.2913,52.1326];

const projection=d3.geoOrthographic()
  .clipAngle(90)
  .precision(.35);

const geoPath=d3.geoPath(projection,ctx);
const graticule=d3.geoGraticule10();

function theme(){
  return document.documentElement.getAttribute('data-theme') || 'night';
}

function palette(){
  if(theme()==='day'){
    return {
      sphereFill:'rgba(215,229,240,.20)',
      sphereGlow:'rgba(82,96,215,.18)',
      grid:'rgba(75,102,128,.12)',
      country:'rgba(70,83,196,.72)',
      countryGlow:'rgba(92,91,236,.22)',
      rim:'rgba(73,104,186,.42)'
    };
  }
  return {
    sphereFill:'rgba(44,50,86,.22)',
    sphereGlow:'rgba(89,81,255,.28)',
    grid:'rgba(145,155,255,.12)',
    country:'rgba(166,174,255,.88)',
    countryGlow:'rgba(90,86,255,.32)',
    rim:'rgba(132,151,255,.58)'
  };
}

function resize(){
  const rect=canvas.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);
  W=rect.width;
  H=rect.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  projection
    .translate([W/2,H/2])
    .scale(Math.min(W,H)*.39*zoom)
    .rotate(rotation);
}
window.addEventListener('resize',resize);
resize();

function drawSphere(p){
  ctx.save();
  ctx.beginPath();
  geoPath({type:'Sphere'});
  ctx.fillStyle=p.sphereFill;
  ctx.shadowColor=p.sphereGlow;
  ctx.shadowBlur=42;
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  geoPath({type:'Sphere'});
  ctx.strokeStyle=p.rim;
  ctx.lineWidth=1.25;
  ctx.stroke();
  ctx.restore();
}

function drawGraticule(p){
  ctx.save();
  ctx.beginPath();
  geoPath(graticule);
  ctx.strokeStyle=p.grid;
  ctx.lineWidth=.7;
  ctx.stroke();
  ctx.restore();
}

function drawCountries(p){
  if(!worldReady) return;

  ctx.save();
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.strokeStyle=p.country;
  ctx.lineWidth=1.05;
  ctx.shadowColor=p.countryGlow;
  ctx.shadowBlur=7;

  for(const feature of countryFeatures){
    ctx.beginPath();
    geoPath(feature);
    ctx.stroke();
  }
  ctx.restore();

  if(netherlandsFeature){
    ctx.save();
    ctx.beginPath();
    geoPath(netherlandsFeature);
    ctx.fillStyle=theme()==='night'?'rgba(70,135,255,.10)':'rgba(70,120,200,.08)';
    ctx.strokeStyle=theme()==='night'?'rgba(117,190,255,.96)':'rgba(58,103,194,.92)';
    ctx.lineWidth=1.8;
    ctx.shadowColor=theme()==='night'?'rgba(75,145,255,.55)':'rgba(80,120,210,.25)';
    ctx.shadowBlur=10;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

function updateNetherlandsAnchor(){
  if(!worldReady || !netherlandsFeature){
    nlLabel.classList.remove('visible');
    nlLine.style.opacity='0';
    nlPoint.style.opacity='0';
    return;
  }

  const center=[-rotation[0],-rotation[1]];
  const visible=d3.geoDistance(netherlandsCentroid,center)<Math.PI/2;
  if(!visible){
    nlLabel.classList.remove('visible');
    nlLine.style.opacity='0';
    nlPoint.style.opacity='0';
    return;
  }

  const pos=projection(netherlandsCentroid);
  if(!pos) return;

  const [x,y]=pos;
  const labelWidth=210;
  const preferRight=x<W*.62;
  const labelX=preferRight?Math.min(W-labelWidth-12,x+64):Math.max(12,x-labelWidth-64);
  const labelY=Math.max(16,Math.min(H-68,y-48));

  nlLabel.style.left=labelX+'px';
  nlLabel.style.top=labelY+'px';
  nlLabel.classList.add('visible');

  const lineX2=preferRight?labelX:labelX+labelWidth;
  const lineY2=labelY+25;
  nlOverlay.setAttribute('viewBox',`0 0 ${W} ${H}`);
  nlLine.setAttribute('x1',x);
  nlLine.setAttribute('y1',y);
  nlLine.setAttribute('x2',lineX2);
  nlLine.setAttribute('y2',lineY2);
  nlPoint.setAttribute('cx',x);
  nlPoint.setAttribute('cy',y);
  nlLine.style.opacity='1';
  nlPoint.style.opacity='1';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const p=palette();

  projection
    .translate([W/2,H/2])
    .scale(Math.min(W,H)*.39*zoom)
    .rotate(rotation);

  drawSphere(p);
  drawGraticule(p);
  drawCountries(p);
  updateNetherlandsAnchor();
}

function animate(now){
  const dt=Math.min(32,now-lastTime);
  lastTime=now;

  if(!dragging){
    targetRotation[0]+=dt*.003;
  }

  rotation[0]+=(targetRotation[0]-rotation[0])*.095;
  rotation[1]+=(targetRotation[1]-rotation[1])*.095;
  zoom+=(targetZoom-zoom)*.10;

  draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

canvas.addEventListener('pointerdown',e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  pointerStart={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;
  lastX=e.clientX;
  lastY=e.clientY;

  targetRotation[0]+=dx*.23;
  targetRotation[1]=Math.max(-72,Math.min(72,targetRotation[1]-dy*.20));
});

function openNetherlands(){
  location.href='netherlands.html';
}

function pointerHitsNetherlands(e){
  if(!netherlandsFeature || !worldReady) return false;
  const rect=canvas.getBoundingClientRect();
  const point=[e.clientX-rect.left,e.clientY-rect.top];
  const lonLat=projection.invert(point);
  if(!lonLat) return false;
  const center=[-rotation[0],-rotation[1]];
  if(d3.geoDistance(lonLat,center)>=Math.PI/2) return false;
  return d3.geoContains(netherlandsFeature,lonLat);
}

function endDrag(e){
  const moved=pointerStart?Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y):999;
  dragging=false;
  try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  if(moved<6 && pointerHitsNetherlands(e)) openNetherlands();
  pointerStart=null;
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

nlLabel.addEventListener('click',openNetherlands);

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  targetZoom=Math.max(.82,Math.min(1.15,targetZoom-e.deltaY*.0006));
},{passive:false});

modeBtn.addEventListener('click',()=>{
  const next=theme()==='night'?'day':'night';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tube-theme',next);
});

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(response=>{
    if(!response.ok) throw new Error('Wereldkaart kon niet worden geladen');
    return response.json();
  })
  .then(world=>{
    countryFeatures=topojson.feature(world,world.objects.countries).features;
    netherlandsFeature=countryFeatures.find(feature=>String(feature.id)==='528') || null;
    worldReady=true;
  })
  .catch(()=>{
    worldReady=false;
  });
</script>
</body>
</html>
