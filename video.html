<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube — videopagina</title>
<style>
:root{
  --ink:#18384a;--muted:#718a96;--line:#dde7ea;--soft:#f7fafb;
  --accent:#4f8993;--highlight:#fff0a6;--shadow:0 20px 50px rgba(24,56,74,.07)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
header{
  height:74px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,3.5vw,54px);border-bottom:1px solid #eff3f4
}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:650;letter-spacing:-.03em;cursor:pointer}
.brandmark{width:24px;height:24px;border-radius:8px 3px 8px 3px;background:linear-gradient(135deg,#92c2c8,#5f99a4)}
.back{border:1px solid #d6e2e6;background:#fff;border-radius:23px;padding:9px 14px;cursor:pointer}
.page{padding:22px clamp(14px,2.2vw,34px) 38px}
.title-row{max-width:1500px;margin:0 auto 18px;display:flex;align-items:end;justify-content:space-between;gap:20px}
.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7a97a4;margin-bottom:5px}
h1{font-size:21px;line-height:1.25;letter-spacing:-.02em;margin:0;font-weight:650}
.workspace{
  max-width:1500px;margin:0 auto;
  display:grid;grid-template-columns:minmax(230px,.78fr) minmax(480px,1.75fr) minmax(260px,.88fr);
  gap:18px;align-items:start
}
.panel{
  border:1px solid var(--line);border-radius:18px;background:#fff;
  box-shadow:0 12px 34px rgba(24,56,74,.045);overflow:hidden
}
.panel-head{
  min-height:54px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 16px;border-bottom:1px solid #edf2f4
}
.panel-title{font-size:13px;font-weight:700}
.language{
  border:1px solid #d9e4e8;background:#fff;border-radius:18px;padding:6px 9px;
  font-size:12px;outline:none
}
.transcript{height:clamp(430px,67vh,720px);overflow:auto;padding:16px 17px 24px}
.transcript p{font-size:13px;line-height:1.72;color:#55717f;margin:0 0 16px}
.transcript .time{display:block;font-size:10.5px;font-weight:700;color:#90a5ae;margin-bottom:5px}

.player-wrap{display:flex;flex-direction:column;gap:14px}
.player{
  position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:
    radial-gradient(circle at 67% 28%,rgba(255,255,255,.76),transparent 24%),
    linear-gradient(145deg,#d8e8ec,#f0f5f6 56%,#c9dce2);
  box-shadow:var(--shadow);display:grid;place-items:center;border:1px solid #dfe8eb
}
.player-label{position:absolute;left:18px;top:16px;font-size:11px;letter-spacing:.08em;color:#688795}
.play{
  width:74px;height:74px;border:0;border-radius:50%;
  background:rgba(24,56,74,.91);cursor:pointer;position:relative;box-shadow:0 12px 30px rgba(24,56,74,.18)
}
.play:after{
  content:"";position:absolute;left:30px;top:24px;border-left:21px solid #fff;
  border-top:13px solid transparent;border-bottom:13px solid transparent
}
.fake-controls{
  position:absolute;left:18px;right:18px;bottom:14px;height:34px;border-radius:10px;
  background:rgba(21,47,60,.80);display:flex;align-items:center;gap:12px;padding:0 12px;color:#fff;font-size:11px
}
.progress{height:3px;background:rgba(255,255,255,.28);flex:1;border-radius:3px;overflow:hidden}.progress:after{content:"";display:block;width:18%;height:100%;background:#fff}
.video-info{padding:2px 3px}
.video-title{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-bottom:7px}
.video-meta{font-size:12px;color:#7b949f}

.notes-panel{min-height:520px}
.toolbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px;
  border-bottom:1px solid #edf2f4;background:#fbfcfc
}
.tool{
  height:32px;border:1px solid #d9e4e8;background:#fff;border-radius:10px;
  padding:0 10px;font-size:11.5px;font-weight:650;cursor:pointer
}
.tool:hover{background:#f3f7f8}
.tool.marker{display:flex;align-items:center;gap:7px}
.marker-dot{width:13px;height:13px;border-radius:4px;background:var(--highlight);border:1px solid #eadb85}
.note-editor{
  min-height:clamp(360px,55vh,610px);padding:18px;outline:none;
  font-size:13.5px;line-height:1.7;color:#395866;overflow:auto
}
.note-editor:empty:before{content:"Schrijf hier je notities…";color:#a0afb6;pointer-events:none}
.note-status{min-height:38px;padding:10px 15px;border-top:1px solid #edf2f4;font-size:11px;color:#8499a3;background:#fcfdfd}
.note-help{font-size:10.5px;color:#92a4ac;padding:0 14px 12px;line-height:1.45}

@media(max-width:1120px){
  .workspace{grid-template-columns:1fr 1.65fr}
  .notes-panel{grid-column:1/-1}
  .note-editor{min-height:260px}
}
@media(max-width:760px){
  header{height:68px}.workspace{grid-template-columns:1fr}
  .player-wrap{grid-row:1}.transcript-panel{grid-row:2}.notes-panel{grid-row:3}
  .transcript{height:360px}.title-row{align-items:start}
}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="location.href='index.html'"><div class="brandmark"></div><span>Tube</span></div>
  <button class="back" id="backBtn">← Video's</button>
</header>

<div class="page">
  <div class="title-row">
    <div>
      <div class="kicker" id="context"></div>
      <h1 id="heading">Voorbeeldvideo</h1>
    </div>
  </div>

  <main class="workspace">
    <aside class="panel transcript-panel">
      <div class="panel-head">
        <div class="panel-title">Transcript</div>
        <select class="language" id="languageSelect" aria-label="Transcript taal">
          <option value="nl">NL</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="transcript" id="transcript"></div>
    </aside>

    <section class="player-wrap">
      <div class="player">
        <div class="player-label">VIDEO PLACEHOLDER</div>
        <button class="play" id="playBtn" aria-label="Afspelen"></button>
        <div class="fake-controls"><span>▶</span><div class="progress"></div><span>12:48</span><span>⛶</span></div>
      </div>
      <div class="video-info">
        <div class="video-title" id="videoTitle">Voorbeeldvideo</div>
        <div class="video-meta">Tube V1 • Educatief • Handmatig geselecteerd</div>
      </div>
    </section>

    <aside class="panel notes-panel">
      <div class="panel-head">
        <div class="panel-title">Notities</div>
        <span style="font-size:11px;color:#8aa0aa">automatisch opgeslagen</span>
      </div>

      <div class="toolbar">
        <button class="tool marker" id="highlightBtn" type="button"><span class="marker-dot"></span>Markeren</button>
        <button class="tool" id="copyBtn" type="button">Kopieer alles</button>
        <button class="tool" id="pasteBtn" type="button">Plak</button>
        <button class="tool" id="clearBtn" type="button">Wis</button>
      </div>

      <div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="true"></div>
      <div class="note-status" id="noteStatus">Klaar om notities te maken.</div>
      <div class="note-help">Selecteer tekst in je notities en klik op <b>Markeren</b> om die passage geel te markeren.</div>
    </aside>
  </main>
</div>

<script src="categories.js"></script>
<script>
const params=new URLSearchParams(location.search);
const cat=params.get('cat') || 'psychologie';
const sub=params.get('sub') || 'Subcategorie';
const videoNumber=Number(params.get('v') || 1);
const category=window.TUBE_CATEGORIES.find(c=>c.slug===cat);
const backUrl=`videos.html?cat=${encodeURIComponent(cat)}&sub=${encodeURIComponent(sub)}`;
document.getElementById('backBtn').onclick=()=>location.href=backUrl;

let titles=[
  `De basis van ${sub}`,
  `${sub}: de belangrijkste principes`,
  `Praktische toepassingen van ${sub}`,
  `Veelgemaakte denkfouten binnen ${sub}`,
  `Verdieping: ${sub}`
];

if(cat==='talen' && sub==='Nederlands'){
  titles=[
    'Werkwoordspelling: zo vind je de stam',
    'Tegenwoordige tijd: ik, jij en hij/zij',
    'Tegenwoordige tijd: jij/je achter de persoonsvorm',
    'Verleden tijd: ’t kofschip / ’t ex-kofschip',
    'Verleden tijd: sterke en onregelmatige werkwoorden'
  ];
}
const title=titles[Math.max(0,Math.min(4,videoNumber-1))];
document.title=`Tube — ${title}`;
document.getElementById('videoTitle').textContent=title;
document.getElementById('heading').textContent=title;
document.getElementById('context').textContent=`${category ? category.name : 'Categorie'} · ${sub}`;

const transcriptData={
  nl:[
    ['00:00','Welkom. In deze voorbeeldvideo behandelen we stap voor stap de kern van dit onderwerp. Het echte transcript wordt later automatisch of handmatig aan de video gekoppeld.'],
    ['00:38','We beginnen met de basis. Het doel is dat je niet alleen informatie hoort, maar ook begrijpt waarom de belangrijkste ideeën relevant zijn.'],
    ['02:14','Een goede manier om dit onderwerp te leren is door eerst de principes te begrijpen en daarna concrete voorbeelden te bekijken.'],
    ['05:31','Let tijdens het kijken op begrippen die je nog niet kent. Je kunt rechts direct notities maken en belangrijke passages markeren.'],
    ['09:07','Aan het einde vatten we de belangrijkste punten samen zodat je snel kunt controleren wat je uit de video hebt meegenomen.']
  ],
  en:[
    ['00:00','Welcome. In this sample video we cover the core of this topic step by step. The real transcript will later be linked to the video automatically or manually.'],
    ['00:38','We start with the fundamentals. The goal is not just to hear information, but to understand why the main ideas matter.'],
    ['02:14','A useful way to learn this topic is to understand the principles first and then study concrete examples.'],
    ['05:31','While watching, notice concepts you do not know yet. You can take notes on the right and highlight important passages.'],
    ['09:07','At the end we summarize the main points so you can quickly check what you learned from the video.']
  ]
};

const dutchGrammarTranscripts={
  1:{
    nl:[
      ['00:00','Bij werkwoordspelling begin je met de stam. Neem het hele werkwoord, bijvoorbeeld werken. Haal -en eraf: werk. Dat is de stam.'],
      ['01:05','Bij werkwoorden waarvan de stam op een dubbele medeklinker of klinker zou eindigen, pas je de gewone Nederlandse spellingregels toe. Lopen wordt loop, maken wordt maak en reizen wordt reis.'],
      ['03:10','Als je de stam goed kunt vinden, worden de regels voor de tegenwoordige en verleden tijd veel eenvoudiger.'],
      ['05:20','Voorbeeld: antwoorden. Haal -en eraf: antwoord. Vanuit die stam kun je vormen maken zoals ik antwoord en hij antwoordt.']
    ],
    en:[
      ['00:00','Dutch verb spelling starts with the stem. Take the infinitive, for example werken, and remove -en: werk.'],
      ['01:05','Then apply normal Dutch spelling rules. Lopen becomes loop, maken becomes maak and reizen becomes reis.'],
      ['03:10','Once you can identify the stem, present and past tense spelling becomes much easier.']
    ]
  },
  2:{
    nl:[
      ['00:00','In de tegenwoordige tijd schrijf je bij ik alleen de stam: ik werk, ik loop, ik antwoord.'],
      ['01:15','Bij jij, je, hij, zij en het staat meestal stam + t: jij werkt, hij loopt, zij antwoordt.'],
      ['03:25','Een belangrijke controle is het onderwerp vervangen door lopen: als je “hij loopt” zou zeggen, hoort er bij een ander werkwoord meestal ook een -t achter de stam.'],
      ['05:40','Let op bij werkwoorden waarvan de stam al op een t eindigt. Bij rusten is de stam rust. Je schrijft hij rust, niet hij rustt.']
    ],
    en:[
      ['00:00','In the Dutch present tense, ik uses only the stem: ik werk.'],
      ['01:15','Jij, hij, zij and het usually use stem + t: jij werkt, hij loopt.'],
      ['05:40','If the stem already ends in t, you do not add a second t.']
    ]
  },
  3:{
    nl:[
      ['00:00','Bij jij of je is de woordvolgorde belangrijk. Staat jij vóór de persoonsvorm, dan schrijf je meestal stam + t: jij werkt.'],
      ['01:35','Staat jij achter de persoonsvorm, dan vervalt de extra t: werk jij, loop jij, antwoord jij.'],
      ['03:10','Vergelijk: jij vindt het leuk, maar vind jij het leuk? Dit is een van de handigste regels om dt-fouten te voorkomen.'],
      ['05:00','Deze uitzondering geldt alleen wanneer jij of je zelf het onderwerp is.']
    ],
    en:[
      ['00:00','With jij or je, word order matters. Before the verb: jij werkt.'],
      ['01:35','After the verb, the extra t disappears: werk jij?'],
      ['03:10','Compare jij vindt with vind jij.']
    ]
  },
  4:{
    nl:[
      ['00:00','Voor zwakke werkwoorden gebruik je in de verleden tijd de regel van ’t ex-kofschip om te kiezen tussen -te en -de.'],
      ['01:20','Kijk naar de laatste medeklinker van de stam. Zit die in de klanken van ’t ex-kofschip, dan gebruik je -te: werken wordt werkte.'],
      ['03:25','Zit de laatste klank er niet in, dan gebruik je -de: leven wordt leefde en antwoorden wordt antwoordde.'],
      ['06:05','In het meervoud voeg je -n toe: wij werkten, wij leefden.']
    ],
    en:[
      ['00:00','For weak Dutch verbs in the past tense, ’t ex-kofschip helps you choose -te or -de.'],
      ['01:20','If the final stem sound belongs to the rule, use -te: werken becomes werkte.'],
      ['03:25','Otherwise use -de: leven becomes leefde.']
    ]
  },
  5:{
    nl:[
      ['00:00','Sterke werkwoorden maken de verleden tijd niet met -te of -de, maar veranderen vaak van klinker. Lopen wordt liep en schrijven wordt schreef.'],
      ['01:40','Deze vormen moet je voor een groot deel leren herkennen en onthouden.'],
      ['03:00','Sommige veelgebruikte werkwoorden zijn onregelmatig: zijn wordt was of waren, hebben wordt had of hadden en gaan wordt ging of gingen.'],
      ['05:25','Bij twijfel helpt een woordenboek of spellingcontrole, maar probeer veelvoorkomende sterke werkwoorden actief te oefenen.']
    ],
    en:[
      ['00:00','Strong Dutch verbs often change their vowel in the past tense: lopen becomes liep.'],
      ['01:40','These forms largely need to be learned and recognized.'],
      ['03:00','Common irregular verbs include zijn → was/waren and hebben → had/hadden.']
    ]
  }
};

if(cat==='talen' && sub==='Nederlands' && dutchGrammarTranscripts[videoNumber]){
  transcriptData.nl=dutchGrammarTranscripts[videoNumber].nl;
  transcriptData.en=dutchGrammarTranscripts[videoNumber].en;
}

const transcript=document.getElementById('transcript');
const languageSelect=document.getElementById('languageSelect');
function renderTranscript(lang){
  transcript.innerHTML=transcriptData[lang].map(([time,text])=>`
    <p><span class="time">${time}</span>${text}</p>
  `).join('');
}
languageSelect.addEventListener('change',()=>renderTranscript(languageSelect.value));
renderTranscript('nl');

document.getElementById('playBtn').addEventListener('click',()=>{
  const btn=document.getElementById('playBtn');
  btn.style.transform='scale(.96)';
  setTimeout(()=>btn.style.transform='',140);
});

const editor=document.getElementById('noteEditor');
const status=document.getElementById('noteStatus');
const noteKey=`tube-notes:${cat}:${sub}:${videoNumber}`;

editor.innerHTML=localStorage.getItem(noteKey) || '';

let saveTimer;
editor.addEventListener('input',()=>{
  clearTimeout(saveTimer);
  status.textContent='Opslaan…';
  saveTimer=setTimeout(()=>{
    localStorage.setItem(noteKey,editor.innerHTML);
    status.textContent='Notities opgeslagen.';
  },350);
});

document.getElementById('highlightBtn').addEventListener('mousedown',e=>{
  e.preventDefault(); // selection behouden
  document.execCommand('hiliteColor',false,'#fff0a6');
  editor.dispatchEvent(new Event('input'));
  status.textContent='Geselecteerde tekst gemarkeerd.';
});

document.getElementById('copyBtn').addEventListener('click',async()=>{
  const text=editor.innerText.trim();
  if(!text){status.textContent='Er zijn nog geen notities om te kopiëren.';return}
  try{
    await navigator.clipboard.writeText(text);
    status.textContent='Alle notities zijn gekopieerd.';
  }catch(err){
    const range=document.createRange();
    range.selectNodeContents(editor);
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    status.textContent='Alle notities zijn gekopieerd.';
  }
});

document.getElementById('pasteBtn').addEventListener('click',async()=>{
  editor.focus();
  try{
    const text=await navigator.clipboard.readText();
    document.execCommand('insertText',false,text);
    editor.dispatchEvent(new Event('input'));
    status.textContent='Tekst geplakt.';
  }catch(err){
    status.textContent='Plakken is door je browser geblokkeerd. Gebruik Cmd/Ctrl + V.';
  }
});

document.getElementById('clearBtn').addEventListener('click',()=>{
  if(editor.innerText.trim() && !confirm('Alle notities voor deze video wissen?')) return;
  editor.innerHTML='';
  localStorage.removeItem(noteKey);
  status.textContent='Notities gewist.';
});
</script>
</body>
</html>
