<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube — video's</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{
  --ink:#18384a;--muted:#718a96;--line:#e3ebee;--soft:#f8fbfb;
  --accent:#4f8993;--shadow:0 18px 44px rgba(24,56,74,.07)
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{
  height:82px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(22px,5vw,72px);border-bottom:1px solid #f0f3f4
}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:650;letter-spacing:-.03em;cursor:pointer}
.brandmark{width:26px;height:26px;border-radius:9px 3px 9px 3px;background:linear-gradient(135deg,#92c2c8,#5f99a4)}
.back{border:1px solid #d8e4e8;background:#fff;border-radius:24px;padding:10px 15px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:56px 24px 86px}
.crumbs{font-size:12px;color:#7a95a2;margin-bottom:22px}
.crumbs button{border:0;background:transparent;padding:0;color:#658693;cursor:pointer}
h1{font-size:clamp(34px,4.5vw,54px);line-height:1.05;letter-spacing:-.045em;font-weight:520;margin:0 0 12px}
.intro{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:42px}
.video-list{display:flex;flex-direction:column;gap:18px}
.video-card{
  display:grid;grid-template-columns:280px 1fr 30px;gap:22px;align-items:center;
  border:1px solid var(--line);border-radius:20px;background:#fff;padding:14px;
  cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease
}
.video-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d4e1e6}
.thumb{
  aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;
  background:
    radial-gradient(circle at 70% 30%,rgba(255,255,255,.75),transparent 26%),
    linear-gradient(145deg,#dcecef,#eef4f5 55%,#cedfe4);
  display:grid;place-items:center;color:#648693;font-size:13px;letter-spacing:.03em
}
.thumb:after{
  content:"";width:46px;height:46px;border-radius:50%;background:rgba(24,56,74,.86);
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)
}
.thumb:before{
  content:"";position:absolute;z-index:2;left:50%;top:50%;
  transform:translate(-35%,-50%);border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent
}
.duration{
  position:absolute;right:9px;bottom:8px;padding:4px 7px;border-radius:7px;
  background:rgba(17,40,51,.82);color:#fff;font-size:11px;z-index:3
}
.meta{min-width:0}
.video-number{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7d9aa7;margin-bottom:9px}
.title{font-size:19px;font-weight:650;line-height:1.3;margin-bottom:8px;letter-spacing:-.015em}
.desc{font-size:13px;line-height:1.5;color:var(--muted);max-width:650px}
.details{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:#8197a2}
.arrow{font-size:24px;color:#7896a3}
@media(max-width:760px){
  .video-card{grid-template-columns:1fr 24px}.thumb{grid-column:1/-1}.meta{grid-column:1}.arrow{grid-column:2}
}

/* TUBE DESIGN EXPERIMENT 01 */
body{
  background:
    radial-gradient(circle at 9% 10%,rgba(142,205,195,.16),transparent 25%),
    radial-gradient(circle at 92% 2%,rgba(180,205,230,.18),transparent 24%),
    linear-gradient(180deg,#f8fbfa 0%,#fffdf9 58%,#f7fafb 100%);
  background-attachment:fixed;
}
header{background:rgba(248,252,251,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom-color:rgba(211,226,226,.6)}
.brandmark{background:linear-gradient(135deg,#8fd3c6,#4f8993 62%,#315e70);box-shadow:0 8px 22px rgba(79,137,147,.20)}
.video-card{
  background:rgba(255,255,255,.88);border-color:rgba(205,221,222,.9);
  box-shadow:0 12px 34px rgba(35,72,82,.045);backdrop-filter:blur(10px)
}
.video-card:hover{box-shadow:0 22px 54px rgba(35,72,82,.11);border-color:#bdd5d3}
.back{background:rgba(255,255,255,.76);backdrop-filter:blur(10px)}
.thumb{background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.82),transparent 26%),linear-gradient(145deg,#d7ebe7,#eef5f4 56%,#cadde1)}


/* TUBE THEME SWITCH */
.header-left{display:flex;align-items:center;gap:14px}
.theme-switch{
  display:flex;align-items:center;gap:3px;padding:3px;
  border:1px solid rgba(111,135,145,.20);border-radius:18px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(10px)
}
.theme-choice{
  height:30px;padding:0 10px;border:0;border-radius:14px;background:transparent;
  color:#6c7f89;font-size:11.5px;font-weight:650;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .18s ease,color .18s ease,box-shadow .18s ease
}
html[data-theme="day"] .theme-choice[data-theme-choice="day"]{
  background:#fff;color:#18384a;box-shadow:0 4px 14px rgba(24,56,74,.09)
}
html[data-theme="night"] .theme-switch{
  background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .theme-choice{color:#8f97a6}
html[data-theme="night"] .theme-choice[data-theme-choice="night"]{
  color:#fff;background:linear-gradient(135deg,rgba(109,75,255,.88),rgba(42,168,255,.78));
  box-shadow:0 5px 16px rgba(77,103,255,.22)
}
@media(max-width:640px){
  .header-left{gap:9px}.theme-label{display:none}.theme-choice{width:31px;padding:0;justify-content:center}
}


/* TUBE NIGHT MODE — paarse focusstijl */
html[data-theme="night"] body{
  background:
    radial-gradient(circle at 82% 8%,rgba(111,70,255,.22),transparent 27%),
    radial-gradient(circle at 12% 16%,rgba(47,112,255,.15),transparent 28%),
    linear-gradient(180deg,#0a0b10 0%,#0d0f15 52%,#0b0d12 100%);
  color:#f5f7fb;background-attachment:fixed
}
html[data-theme="night"] header{
  background:rgba(10,11,16,.70);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom-color:rgba(255,255,255,.06)
}
html[data-theme="night"] .brand{color:#fff}
html[data-theme="night"] .brandmark{
  background:linear-gradient(145deg,#6f46ff 0%,#4d7cff 48%,#28b8ff 100%);
  box-shadow:0 0 28px rgba(92,91,255,.35)
}
html[data-theme="night"] h1,
html[data-theme="night"] .title,
html[data-theme="night"] .section-title,
html[data-theme="night"] .subname,
html[data-theme="night"] .level-name,
html[data-theme="night"] .phase-name,
html[data-theme="night"] .video-title,
html[data-theme="night"] .panel-title{color:#f5f7fb}
html[data-theme="night"] .eyebrow,
html[data-theme="night"] .kicker{color:#aab8ff}
html[data-theme="night"] .intro,
html[data-theme="night"] .subdesc,
html[data-theme="night"] .level-desc,
html[data-theme="night"] .phase-desc,
html[data-theme="night"] .desc,
html[data-theme="night"] .video-meta,
html[data-theme="night"] .crumb,
html[data-theme="night"] .crumbs,
html[data-theme="night"] .helper,
html[data-theme="night"] .note-help{color:#8f97a6}
html[data-theme="night"] .sublist,
html[data-theme="night"] .levels,
html[data-theme="night"] .phase,
html[data-theme="night"] .video-card,
html[data-theme="night"] .panel,
html[data-theme="night"] .modal{
  background:rgba(20,22,29,.94);border-color:rgba(255,255,255,.075);
  box-shadow:0 22px 58px rgba(0,0,0,.28);backdrop-filter:blur(16px)
}
html[data-theme="night"] .sub,
html[data-theme="night"] .level,
html[data-theme="night"] .phase-head,
html[data-theme="night"] .topics,
html[data-theme="night"] .video-card,
html[data-theme="night"] .panel-head,
html[data-theme="night"] .toolbar,
html[data-theme="night"] .note-status{
  border-color:rgba(255,255,255,.07)
}
html[data-theme="night"] .sub:hover,
html[data-theme="night"] .level:hover,
html[data-theme="night"] .video-card:hover{background:#1b1e26}
html[data-theme="night"] .topic,
html[data-theme="night"] .transcript p,
html[data-theme="night"] .note-editor{color:#aeb6c3}
html[data-theme="night"] .topic{border-color:rgba(255,255,255,.06)}
html[data-theme="night"] .topic:before{background:#7586ff}
html[data-theme="night"] .back,
html[data-theme="night"] .add-sub,
html[data-theme="night"] .lessons,
html[data-theme="night"] .tool,
html[data-theme="night"] .language,
html[data-theme="night"] .btn-secondary{
  color:#eef2f8;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .btn-primary{
  background:linear-gradient(135deg,#6d4bff,#2aa8ff);border-color:transparent;color:#fff
}
html[data-theme="night"] .note,
html[data-theme="night"] .toolbar,
html[data-theme="night"] .note-status,
html[data-theme="night"] .phase-head{background:rgba(255,255,255,.035)}
html[data-theme="night"] .note{color:#9ba6b5;border-color:rgba(255,255,255,.07)}
html[data-theme="night"] .note code{background:#1b1e26;color:#c8d0dc}
html[data-theme="night"] .field input,
html[data-theme="night"] .field textarea{
  color:#f2f5fa;background:#15171d;border-color:rgba(255,255,255,.10)
}
html[data-theme="night"] .thumb,
html[data-theme="night"] .player{
  border-color:rgba(255,255,255,.08);
  background:radial-gradient(circle at 70% 30%,rgba(111,70,255,.26),transparent 28%),linear-gradient(145deg,#171a26,#202334 58%,#151821)
}
html[data-theme="night"] .player-label,
html[data-theme="night"] .video-number,
html[data-theme="night"] .time{color:#8f97a6}
html[data-theme="night"] .arrow{color:#8994ad}

</style>
</head>
<body>
<header>
  <div class="header-left">
<div class="brand" onclick="location.href='index.html'"><div class="brandmark"></div><span>Tube</span></div>
<div class="theme-switch" aria-label="Weergavemodus">
  <button class="theme-choice" type="button" data-theme-choice="day" aria-label="Overdagmodus"><span>☀</span><span class="theme-label">Overdag</span></button>
  <button class="theme-choice" type="button" data-theme-choice="night" aria-label="Nachtmodus"><span>☾</span><span class="theme-label">Nacht</span></button>
</div>
</div>
  <button class="back" id="backBtn">← Terug</button>
</header>

<main>
  <div class="crumbs"><button onclick="location.href='index.html'">Home</button> &nbsp;/&nbsp; <span id="categoryCrumb"></span> &nbsp;/&nbsp; <span id="subCrumb"></span></div>
  <h1 id="pageTitle">Subcategorie</h1>
  <div class="intro">Voor Tube V1 staan hier vijf voorbeeldvideo’s. De thumbnails en echte video’s voegen we later toe.</div>
  <div class="video-list" id="videoList"></div>
</main>

<script src="categories.js"></script>
<script>
const params=new URLSearchParams(location.search);
const catSlug=params.get('cat') || 'psychologie';
const sub=params.get('sub') || 'Subcategorie';
const category=window.TUBE_CATEGORIES.find(c=>c.slug===catSlug);

document.title=`Tube — ${sub}`;
document.getElementById('pageTitle').textContent=sub;
document.getElementById('categoryCrumb').textContent=category ? category.name : 'Categorie';
document.getElementById('subCrumb').textContent=sub;
document.getElementById('backBtn').onclick=()=>location.href=`category.html?cat=${encodeURIComponent(catSlug)}`;

let examples=[
  {title:`De basis van ${sub}`,desc:`Een heldere introductie tot de belangrijkste ideeën binnen ${sub}.`,duration:'12:48',level:'Beginner'},
  {title:`${sub}: de belangrijkste principes`,desc:`Een overzichtelijke uitleg van concepten die je nodig hebt om het onderwerp goed te begrijpen.`,duration:'18:21',level:'Beginner'},
  {title:`Praktische toepassingen van ${sub}`,desc:`Van theorie naar praktijk met concrete voorbeelden en situaties.`,duration:'15:36',level:'Gemiddeld'},
  {title:`Veelgemaakte denkfouten binnen ${sub}`,desc:`Leer waar mensen vaak de mist in gaan en hoe je kritischer naar het onderwerp kijkt.`,duration:'20:04',level:'Gemiddeld'},
  {title:`Verdieping: ${sub}`,desc:`Een langere verdiepende video voor wanneer je de basis al beheerst.`,duration:'27:19',level:'Verdieping'}
];

if(catSlug==='talen' && sub==='Nederlands'){
  examples=[
    {title:'Werkwoordspelling: zo vind je de stam',desc:'Leer de basisregel waarmee je Nederlandse werkwoorden correct vervoegt.',duration:'08:40',level:'Beginner'},
    {title:'Tegenwoordige tijd: ik, jij en hij/zij',desc:'Leer wanneer je alleen de stam schrijft en wanneer er een -t achter komt.',duration:'11:25',level:'Beginner'},
    {title:'Tegenwoordige tijd: jij/je achter de persoonsvorm',desc:'Begrijp de uitzondering bij zinnen zoals “Loop jij?” en voorkom dt-fouten.',duration:'09:55',level:'Beginner'},
    {title:'Verleden tijd: ’t kofschip / ’t ex-kofschip',desc:'Leer wanneer een zwak werkwoord in de verleden tijd -te of -de krijgt.',duration:'13:10',level:'Beginner'},
    {title:'Verleden tijd: sterke en onregelmatige werkwoorden',desc:'Leer hoe werkwoorden zoals lopen, zijn en hebben in de verleden tijd veranderen.',duration:'14:35',level:'Gemiddeld'}
  ];
}

const list=document.getElementById('videoList');
list.innerHTML=examples.map((v,i)=>`
  <article class="video-card" tabindex="0" role="link"
    onclick="openVideo(${i+1})"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openVideo(${i+1})}">
    <div class="thumb"><span>THUMBNAIL</span><span class="duration">${v.duration}</span></div>
    <div class="meta">
      <div class="video-number">Voorbeeldvideo ${i+1}</div>
      <div class="title">${v.title}</div>
      <div class="desc">${v.desc}</div>
      <div class="details"><span>${v.level}</span><span>•</span><span>Educatief</span><span>•</span><span>Handmatig geselecteerd</span></div>
    </div>
    <div class="arrow">→</div>
  </article>
`).join('');

function openVideo(n){
  location.href=`video.html?cat=${encodeURIComponent(catSlug)}&sub=${encodeURIComponent(sub)}&v=${n}`;
}
</script>
<script>
(function(){
  const buttons=document.querySelectorAll('[data-theme-choice]');
  function setTheme(theme){
    document.documentElement.setAttribute('data-theme',theme);
    localStorage.setItem('tube-theme',theme);
    buttons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.themeChoice===theme)));
  }
  buttons.forEach(btn=>btn.addEventListener('click',()=>setTheme(btn.dataset.themeChoice)));
  setTheme(document.documentElement.getAttribute('data-theme') || 'night');
})();
</script>
</body>
</html>
