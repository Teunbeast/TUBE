<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nederland — OWSY</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{
  --ui:#18384a;--muted:#708995;--glass:rgba(255,255,255,.72);
  --line:rgba(38,79,90,.12)
}
html[data-theme="night"]{
  --ui:#f5f7fb;--muted:#8f97a6;--glass:rgba(14,16,23,.58);
  --line:rgba(255,255,255,.09)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;
  color:var(--ui);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 75% 18%,rgba(116,78,255,.18),transparent 30%),
    radial-gradient(circle at 24% 72%,rgba(42,162,255,.11),transparent 33%),
    linear-gradient(180deg,#f7fbfa,#fffdf9)
}
html[data-theme="night"] body{
  background:
    radial-gradient(circle at 76% 16%,rgba(111,70,255,.22),transparent 31%),
    radial-gradient(circle at 24% 74%,rgba(34,133,255,.13),transparent 34%),
    linear-gradient(180deg,#090a0f,#0d0f16 58%,#0a0c12)
}
.ambient{
  position:fixed;inset:-18%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 49%,rgba(88,86,255,.12),transparent 25%),
    radial-gradient(circle at 50% 54%,rgba(46,168,255,.06),transparent 39%);
  filter:blur(28px)
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;height:82px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,58px)
}
.back,.mode{
  border:1px solid var(--line);background:var(--glass);color:var(--ui);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer
}
.back{
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:22px;
  font:inherit;font-size:13px;font-weight:650
}
.mode{width:40px;height:40px;border-radius:50%;font-size:16px}
.identity{
  position:absolute;left:50%;transform:translateX(-50%);text-align:center
}
.identity strong{
  display:block;font-size:13px;font-weight:690;letter-spacing:.16em
}
.identity span{
  display:block;margin-top:3px;color:var(--muted);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase
}
.experience{
  position:fixed;inset:82px 0 0;display:grid;place-items:center;
  padding:22px
}
.world-label{
  position:fixed;left:clamp(24px,5vw,72px);top:118px;z-index:10;
  pointer-events:none
}
.world-label span{
  display:block;color:var(--muted);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase
}
.world-label strong{
  display:block;margin-top:7px;color:var(--ui);
  font-size:clamp(22px,2.2vw,34px);font-weight:620;
  letter-spacing:-.035em
}
.world-label em{
  display:block;margin-top:7px;color:var(--muted);
  font-size:12px;font-style:normal
}
.map-wrap{
  position:relative;
  width:min(62vw,760px);
  height:min(86vh,900px);
  min-width:320px;min-height:420px;
  display:grid;place-items:center;
  animation:floatMap 7s ease-in-out infinite
}
.map-wrap:before{
  content:"";position:absolute;width:70%;height:78%;border-radius:46%;
  background:
    radial-gradient(circle at 50% 48%,rgba(95,91,255,.075),transparent 61%),
    radial-gradient(circle at 50% 72%,rgba(28,117,255,.045),transparent 52%);
  filter:blur(28px);pointer-events:none
}
.map-wrap:after{
  content:"";position:absolute;left:17%;right:17%;bottom:7%;
  height:9%;border-radius:50%;
  background:rgba(0,0,0,.20);filter:blur(24px);
  transform:scaleX(.82);pointer-events:none;opacity:.62
}
#nlMap{
  width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.16));
  transition:filter .3s ease
}
.province{
  cursor:pointer;
  transform-box:fill-box;transform-origin:center;
  transition:fill .24s cubic-bezier(.2,.8,.2,1),
             stroke .24s ease,
             filter .24s ease,
             transform .24s cubic-bezier(.2,.8,.2,1);
  paint-order:stroke fill
}
.province-depth{pointer-events:none}
.province-rim{pointer-events:none}
.map-sheen{pointer-events:none}
.province-label{
  position:fixed;z-index:30;pointer-events:none;
  padding:7px 10px;border-radius:11px;
  background:rgba(11,15,25,.82);color:#eef4ff;
  border:1px solid rgba(152,180,255,.16);
  font-size:11px;opacity:0;white-space:nowrap;
  transform:translate(12px,-8px);
  transition:opacity .12s ease;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
html[data-theme="day"] .province-label{
  background:rgba(255,255,255,.92);color:#24425a
}
.hint{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:12;padding:8px 12px;border-radius:18px;
  border:1px solid var(--line);background:var(--glass);
  color:var(--muted);font-size:11px;letter-spacing:.03em;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.attribution{
  position:fixed;right:16px;bottom:12px;
  color:var(--muted);font-size:9px;opacity:.5
}
@keyframes floatMap{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@media(max-width:800px){
  .topbar{height:68px;padding:0 16px}
  .identity strong{font-size:11px}
  .experience{inset:68px 0 0;padding:14px}
  .map-wrap{width:100vw;height:96vh;min-width:0;min-height:520px}
  .world-label{left:18px;top:88px}
  .world-label strong{font-size:22px}
  .world-label em{display:none}
  .hint{bottom:18px}
}
@media(prefers-reduced-motion:reduce){
  .map-wrap{animation:none}
}
</style>
</head>
<body>
<div class="ambient"></div>

<div class="topbar">
  <button class="back" type="button" onclick="location.href='owsy.html'"><span>←</span><span>Wereldbol</span></button>
  <div class="identity">
    <strong>NEDERLAND</strong>
    <span>Groep 7–8 · St. Jacobusschool</span>
  </div>
  <button class="mode" id="modeBtn" type="button" aria-label="Wissel dag- en nachtmodus">◐</button>
</div>

<div class="world-label">
  <span>OWSY · Nederland</span>
  <strong>Kies je gebied.</strong>
  <em>Ontdek straks per provincie wat er te leren valt.</em>
</div>

<main class="experience">
  <div class="map-wrap" id="mapWrap">
    <svg id="nlMap" aria-label="Nederland met provinciegrenzen"></svg>
  </div>
</main>

<div class="province-label" id="provinceLabel"></div>
<div class="hint">Beweeg over een provincie</div>
<div class="attribution">Kaartdata: CBS/PDOK via cartomap.nl</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const svg=d3.select('#nlMap');
const wrap=document.getElementById('mapWrap');
const label=document.getElementById('provinceLabel');
const modeBtn=document.getElementById('modeBtn');
let provinces=null;

function theme(){
  return document.documentElement.getAttribute('data-theme') || 'night';
}

function colors(){
  return theme()==='night'
    ? {
        fillTop:'rgba(72,86,145,.30)',
        fillBottom:'rgba(42,52,94,.22)',
        depth:'rgba(13,18,37,0)',
        depthStroke:'rgba(78,95,166,0)',
        stroke:'rgba(190,199,255,.96)',
        rim:'rgba(224,231,255,.24)',
        hover:'rgba(90,122,220,.42)',
        hoverStroke:'rgba(135,208,255,.98)',
        glow:'rgba(91,91,255,.08)',
        sheen:'rgba(185,205,255,.035)'
      }
    : {
        fillTop:'rgba(183,210,225,.48)',
        fillBottom:'rgba(115,158,190,.16)',
        depth:'rgba(78,104,135,.20)',
        depthStroke:'rgba(69,103,151,.32)',
        stroke:'rgba(58,91,150,.76)',
        rim:'rgba(255,255,255,.70)',
        hover:'rgba(105,157,202,.36)',
        hoverStroke:'rgba(57,112,194,.98)',
        glow:'rgba(72,111,185,.18)',
        sheen:'rgba(255,255,255,.22)'
      };
}

function render(){
  if(!provinces) return;

  const rect=wrap.getBoundingClientRect();
  const width=rect.width;
  const height=rect.height;

  svg.attr('viewBox',`0 0 ${width} ${height}`);

  const mobile=window.matchMedia('(max-width:800px)').matches;
  const projection=d3.geoIdentity()
    .reflectY(true)
    .fitExtent(
      mobile
        ? [[width*.012,height*.01],[width*.988,height*.99]]
        : [[width*.055,height*.025],[width*.945,height*.975]],
      provinces
    );

  const path=d3.geoPath(projection);
  const c=colors();

  const defs=svg.selectAll('defs').data([null]).join('defs');
  const grad=defs.selectAll('#provinceSurface').data([null]).join('linearGradient')
    .attr('id','provinceSurface')
    .attr('x1','0%').attr('y1','0%').attr('x2','100%').attr('y2','100%');
  grad.selectAll('stop').data([
    {o:'0%',c:c.fillTop},
    {o:'52%',c:c.fillBottom},
    {o:'100%',c:c.fillTop}
  ]).join('stop')
    .attr('offset',d=>d.o)
    .attr('stop-color',d=>d.c);

  const root=svg.selectAll('g.map-root')
    .data([null])
    .join('g')
    .attr('class','map-root');

  const depth=root.selectAll('g.depth-layer').data([null]).join('g')
    .attr('class','depth-layer')
    .attr('transform','translate(0,0)');

  depth.selectAll('path.province-depth')
    .data(provinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province-depth')
    .attr('d',path)
    .attr('fill',c.depth)
    .attr('stroke',c.depthStroke)
    .attr('stroke-width',0)
    .attr('vector-effect','non-scaling-stroke');

  const surface=root.selectAll('g.surface-layer').data([null]).join('g')
    .attr('class','surface-layer');

  surface.selectAll('path.province')
    .data(provinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province')
    .attr('d',path)
    .attr('fill','url(#provinceSurface)')
    .attr('stroke',c.stroke)
    .attr('stroke-width',1.55)
    .attr('vector-effect','non-scaling-stroke')
    .style('filter',`drop-shadow(0 0 2px ${c.glow})`)
    .on('mouseenter',function(event,d){
      d3.select(this)
        .attr('fill',c.hover)
        .attr('stroke',c.hoverStroke)
        .attr('stroke-width',1.95)
        .attr('transform','scale(1.018)')
        .style('filter',`drop-shadow(0 0 8px ${c.glow})`);
      label.textContent=d.properties.statnaam || 'Provincie';
      label.style.opacity='1';
    })
    .on('mousemove',function(event){
      label.style.left=event.clientX+'px';
      label.style.top=event.clientY+'px';
    })
    .on('mouseleave',function(){
      d3.select(this)
        .attr('fill','url(#provinceSurface)')
        .attr('stroke',c.stroke)
        .attr('stroke-width',1.55)
        .attr('transform','scale(1)')
        .style('filter',`drop-shadow(0 0 2px ${c.glow})`);
      label.style.opacity='0';
    });

  surface.selectAll('path.province-rim')
    .data(provinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province-rim')
    .attr('d',path)
    .attr('fill','none')
    .attr('stroke',c.rim)
    .attr('stroke-width',.35)
    .attr('vector-effect','non-scaling-stroke')
    .attr('transform',null);

  const outline={type:'FeatureCollection',features:provinces.features};
  root.selectAll('path.map-sheen')
    .data([outline])
    .join('path')
    .attr('class','map-sheen')
    .attr('d',path)
    .attr('fill','none')
    .attr('stroke',c.sheen)
    .attr('stroke-width',1.35)
    .attr('vector-effect','non-scaling-stroke')
    .attr('transform',null);
}

function loadMap(){
  fetch('netherlands-provinces.geojson')
    .then(r=>{
      if(!r.ok) throw new Error('geojson');
      return r.json();
    })
    .then(data=>{
      provinces=data;
      render();
    });
}

window.addEventListener('resize',render);

modeBtn.addEventListener('click',()=>{
  const next=theme()==='night'?'day':'night';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tube-theme',next);
  render();
});

loadMap();
</script>
</body>
</html>
