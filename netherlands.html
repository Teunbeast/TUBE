<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nederland — OWSY</title>
<script>
(function(){
  const saved=localStorage.getItem('tube-theme') || 'night';
  document.documentElement.setAttribute('data-theme',saved);
})();
</script>
<style>
:root{
  --ui:#18384a;--muted:#708995;--glass:rgba(255,255,255,.72);
  --line:rgba(38,79,90,.12)
}
html[data-theme="night"]{
  --ui:#f5f7fb;--muted:#8f97a6;--glass:rgba(14,16,23,.58);
  --line:rgba(255,255,255,.09)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Manrope,"Avenir Next","Segoe UI",Arial,sans-serif;
  color:var(--ui);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 76% 15%,rgba(126,92,255,.20),transparent 32%),
    radial-gradient(circle at 18% 76%,rgba(46,170,255,.13),transparent 35%),
    linear-gradient(155deg,#f7fbff 0%,#f1f5ff 46%,#fbf8ff 100%)
}
html[data-theme="night"] body{
  background:
    radial-gradient(circle at 84% 10%,rgba(124,92,255,.26),transparent 31%),
    radial-gradient(circle at 12% 70%,rgba(62,181,255,.18),transparent 36%),
    linear-gradient(155deg,#10152d 0%,#182c4a 38%,#2b4b69 70%,#466b7d 100%)
}
.ambient{
  position:fixed;inset:-18%;pointer-events:none;
  background:
    radial-gradient(circle at 54% 42%,rgba(178,197,255,.14),transparent 24%),
    radial-gradient(circle at 44% 62%,rgba(79,194,255,.10),transparent 38%);
  filter:blur(42px)
}
.terrain-grid{
  position:fixed;inset:0;pointer-events:none;opacity:.23;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:linear-gradient(to bottom,transparent 5%,rgba(0,0,0,.75) 35%,transparent 88%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 5%,rgba(0,0,0,.75) 35%,transparent 88%);
  transform:perspective(900px) rotateX(63deg) translateY(31%);
  transform-origin:50% 70%
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;height:82px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,58px)
}
.back,.mode{
  border:1px solid var(--line);background:var(--glass);color:var(--ui);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 10px 35px rgba(0,0,0,.08);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer
}
.back{
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:22px;
  font:inherit;font-size:13px;font-weight:650
}
.mode{width:40px;height:40px;border-radius:50%;font-size:16px}
.identity{
  position:absolute;left:50%;transform:translateX(-50%);text-align:center
}
.identity strong{
  display:block;font-size:13px;font-weight:690;letter-spacing:.16em
}
.identity span{
  display:block;margin-top:3px;color:var(--muted);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase
}
.experience{
  position:fixed;inset:82px 0 0;display:grid;place-items:center;
  padding:22px
}
.world-label{
  position:fixed;left:clamp(24px,5vw,72px);top:118px;z-index:10;
  pointer-events:none
}
.world-label span{
  display:block;color:var(--muted);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase
}
.world-label strong{
  display:block;margin-top:7px;color:var(--ui);
  font-size:clamp(22px,2.2vw,34px);font-weight:620;
  letter-spacing:-.035em
}
.world-label em{
  display:block;margin-top:7px;color:var(--muted);
  font-size:12px;font-style:normal
}
.map-wrap{
  position:relative;
  width:min(72vw,860px);
  height:min(84vh,900px);
  min-width:360px;min-height:500px;
  display:grid;place-items:center;
  perspective:1200px;
  animation:floatMap 8s ease-in-out infinite
}
.map-wrap:before{
  content:"";position:absolute;width:78%;height:83%;border-radius:48%;
  background:
    radial-gradient(circle at 50% 45%,rgba(202,216,255,.13),transparent 54%),
    radial-gradient(circle at 48% 72%,rgba(61,170,255,.09),transparent 62%);
  filter:blur(35px);pointer-events:none
}
.map-wrap:after{
  content:"";position:absolute;left:13%;right:13%;bottom:5%;
  height:12%;border-radius:50%;
  background:rgba(5,14,32,.28);filter:blur(26px);
  transform:scaleX(.86);pointer-events:none;opacity:.7
}
#nlMap{
  width:100%;height:100%;display:block;overflow:hidden;
  filter:drop-shadow(0 24px 30px rgba(7,18,43,.18));
  transition:filter .3s ease
}
.neighbor-shadow,.neighbor-land{pointer-events:none}
.neighbor-shadow{fill:rgba(5,13,30,.10);filter:blur(7px)}
.neighbor-land{
  fill:rgba(220,233,255,.045);
  stroke:rgba(232,241,255,.10);
  stroke-width:1.15;
  vector-effect:non-scaling-stroke;
  filter:blur(.18px)
}
html[data-theme="day"] .neighbor-shadow{fill:rgba(54,90,124,.10)}
html[data-theme="day"] .neighbor-land{
  fill:rgba(91,133,167,.075);
  stroke:rgba(68,105,142,.15)
}
.province{
  cursor:pointer;
  transform-box:fill-box;transform-origin:center;
  transition:fill .24s cubic-bezier(.2,.8,.2,1),
             stroke .24s ease,
             filter .24s ease,
             transform .24s cubic-bezier(.2,.8,.2,1);
  paint-order:stroke fill
}
.province-depth{pointer-events:none}
.province-rim{pointer-events:none}
.map-sheen{pointer-events:none}
.province-label{
  position:fixed;z-index:30;pointer-events:none;
  padding:7px 10px;border-radius:11px;
  background:rgba(11,15,25,.82);color:#eef4ff;
  border:1px solid rgba(152,180,255,.16);
  font-size:11px;opacity:0;white-space:nowrap;
  transform:translate(12px,-8px);
  transition:opacity .12s ease;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
html[data-theme="day"] .province-label{
  background:rgba(255,255,255,.92);color:#24425a
}
.hint{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:12;padding:8px 12px;border-radius:18px;
  border:1px solid var(--line);background:var(--glass);
  color:var(--muted);font-size:11px;letter-spacing:.03em;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.attribution{
  position:fixed;right:16px;bottom:12px;
  color:var(--muted);font-size:9px;opacity:.5
}
@keyframes floatMap{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@media(max-width:800px){
  .topbar{height:68px;padding:0 16px}
  .identity strong{font-size:11px}
  .experience{inset:68px 0 0;padding:14px}
  .map-wrap{width:100vw;height:78vh;min-width:0;min-height:560px;max-height:780px}
  .world-label{left:18px;top:88px}
  .world-label strong{font-size:22px}
  .world-label em{display:none}
  .hint{bottom:18px}
}
@media(prefers-reduced-motion:reduce){
  .map-wrap{animation:none}
}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="terrain-grid"></div>

<div class="topbar">
  <button class="back" type="button" onclick="location.href='owsy.html'"><span>←</span><span>Wereldbol</span></button>
  <div class="identity">
    <strong>NEDERLAND</strong>
    <span>Groep 7–8 · St. Jacobusschool</span>
  </div>
  <button class="mode" id="modeBtn" type="button" aria-label="Wissel dag- en nachtmodus">◐</button>
</div>

<div class="world-label">
  <span>OWSY · Nederland</span>
  <strong>Kies je gebied.</strong>
  <em>Ontdek straks per provincie wat er te leren valt.</em>
</div>

<main class="experience">
  <div class="map-wrap" id="mapWrap">
    <svg id="nlMap" aria-label="Nederland met provinciegrenzen"></svg>
  </div>
</main>

<div class="province-label" id="provinceLabel"></div>
<div class="hint">Beweeg over een provincie</div>
<div class="attribution">Kaartdata: CBS/PDOK via cartomap.nl</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const svg=d3.select('#nlMap');
const wrap=document.getElementById('mapWrap');
const label=document.getElementById('provinceLabel');
const modeBtn=document.getElementById('modeBtn');
let provinces=null;
let neighbors=[];

function theme(){
  return document.documentElement.getAttribute('data-theme') || 'night';
}

function colors(){
  return theme()==='night'
    ? {
        fillTop:'rgba(111,135,218,.62)',
        fillBottom:'rgba(45,80,145,.48)',
        depth:'rgba(18,35,69,.22)',
        depthStroke:'rgba(137,169,225,.18)',
        stroke:'rgba(218,229,255,.91)',
        rim:'rgba(245,249,255,.34)',
        hover:'rgba(129,166,239,.72)',
        hoverStroke:'rgba(165,225,255,.98)',
        glow:'rgba(94,139,255,.28)',
        sheen:'rgba(226,239,255,.12)'
      }
    : {
        fillTop:'rgba(183,210,225,.48)',
        fillBottom:'rgba(115,158,190,.16)',
        depth:'rgba(78,104,135,.20)',
        depthStroke:'rgba(69,103,151,.32)',
        stroke:'rgba(58,91,150,.76)',
        rim:'rgba(255,255,255,.70)',
        hover:'rgba(105,157,202,.36)',
        hoverStroke:'rgba(57,112,194,.98)',
        glow:'rgba(72,111,185,.18)',
        sheen:'rgba(255,255,255,.22)'
      };
}

function render(){
  if(!provinces) return;

  const rect=wrap.getBoundingClientRect();
  const width=rect.width;
  const height=rect.height;

  svg.attr('viewBox',`0 0 ${width} ${height}`);

  const mobile=window.matchMedia('(max-width:800px)').matches;

  // The source is WGS84 lon/lat, but its polygon winding is intended for planar cartography.
  // Convert lon/lat to a local planar coordinate system first, then fit it cleanly.
  const lat0=52.15*Math.PI/180;
  const flattenCoords=coords=>{
    if(typeof coords[0]==='number'){
      return [coords[0]*Math.cos(lat0),coords[1]];
    }
    return coords.map(flattenCoords);
  };
  const flattenFeature=f=>({
    ...f,
    geometry:{...f.geometry,coordinates:flattenCoords(f.geometry.coordinates)}
  });
  const flatProvinces={
    type:'FeatureCollection',
    features:provinces.features.map(flattenFeature)
  };
  const flatNeighbors=neighbors.map(flattenFeature);

  const projection=d3.geoIdentity()
    .reflectY(true)
    .fitExtent(
      mobile
        ? [[width*.055,height*.04],[width*.945,height*.96]]
        : [[width*.13,height*.035],[width*.87,height*.965]],
      flatProvinces
    );

  const path=d3.geoPath(projection);
  const c=colors();

  const defs=svg.selectAll('defs').data([null]).join('defs');
  const grad=defs.selectAll('#provinceSurface').data([null]).join('linearGradient')
    .attr('id','provinceSurface')
    .attr('x1','0%').attr('y1','0%').attr('x2','100%').attr('y2','100%');
  grad.selectAll('stop').data([
    {o:'0%',c:c.fillTop},
    {o:'52%',c:c.fillBottom},
    {o:'100%',c:c.fillTop}
  ]).join('stop')
    .attr('offset',d=>d.o)
    .attr('stop-color',d=>d.c);

  const root=svg.selectAll('g.map-root')
    .data([null])
    .join('g')
    .attr('class','map-root');

  const neighborRoot=root.selectAll('g.neighbor-layer')
    .data([null]).join('g')
    .attr('class','neighbor-layer');

  neighborRoot.selectAll('path.neighbor-shadow')
    .data(flatNeighbors,d=>d.id)
    .join('path')
    .attr('class','neighbor-shadow')
    .attr('d',path)
    .attr('transform','translate(0,10)');

  neighborRoot.selectAll('path.neighbor-land')
    .data(flatNeighbors,d=>d.id)
    .join('path')
    .attr('class','neighbor-land')
    .attr('d',path);

  const depth=root.selectAll('g.depth-layer').data([null]).join('g')
    .attr('class','depth-layer')
    .attr('transform','translate(0,7)');

  depth.selectAll('path.province-depth')
    .data(flatProvinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province-depth')
    .attr('d',path)
    .attr('fill',c.depth)
    .attr('stroke',c.depthStroke)
    .attr('stroke-width',.8)
    .attr('vector-effect','non-scaling-stroke');

  const surface=root.selectAll('g.surface-layer').data([null]).join('g')
    .attr('class','surface-layer');

  surface.selectAll('path.province')
    .data(flatProvinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province')
    .attr('d',path)
    .attr('fill','url(#provinceSurface)')
    .attr('stroke',c.stroke)
    .attr('stroke-width',1.55)
    .attr('vector-effect','non-scaling-stroke')
    .style('filter',`drop-shadow(0 0 2px ${c.glow})`)
    .on('mouseenter',function(event,d){
      d3.select(this)
        .attr('fill',c.hover)
        .attr('stroke',c.hoverStroke)
        .attr('stroke-width',1.95)
        .attr('transform','scale(1.018)')
        .style('filter',`drop-shadow(0 0 8px ${c.glow})`);
      label.textContent=d.properties.statnaam || 'Provincie';
      label.style.opacity='1';
    })
    .on('mousemove',function(event){
      label.style.left=event.clientX+'px';
      label.style.top=event.clientY+'px';
    })
    .on('mouseleave',function(){
      d3.select(this)
        .attr('fill','url(#provinceSurface)')
        .attr('stroke',c.stroke)
        .attr('stroke-width',1.55)
        .attr('transform','scale(1)')
        .style('filter',`drop-shadow(0 0 2px ${c.glow})`);
      label.style.opacity='0';
    });

  surface.selectAll('path.province-rim')
    .data(flatProvinces.features,d=>d.properties.statnaam)
    .join('path')
    .attr('class','province-rim')
    .attr('d',path)
    .attr('fill','none')
    .attr('stroke',c.rim)
    .attr('stroke-width',.35)
    .attr('vector-effect','non-scaling-stroke')
    .attr('transform',null);

  const outline={type:'FeatureCollection',features:flatProvinces.features};
  root.selectAll('path.map-sheen')
    .data([outline])
    .join('path')
    .attr('class','map-sheen')
    .attr('d',path)
    .attr('fill','none')
    .attr('stroke',c.sheen)
    .attr('stroke-width',1.35)
    .attr('vector-effect','non-scaling-stroke')
    .attr('transform',null);
}

function loadMap(){
  Promise.all([
    fetch('netherlands-provinces.geojson').then(r=>{
      if(!r.ok) throw new Error('geojson');
      return r.json();
    }),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>{
      if(!r.ok) throw new Error('world');
      return r.json();
    })
  ]).then(([data,world])=>{
    provinces=data;
    const countries=topojson.feature(world,world.objects.countries).features;
    neighbors=countries.filter(d=>{
      const id=String(d.id).padStart(3,'0');
      return id==='056' || id==='276';
    });
    render();
  }).catch(()=>{
    fetch('netherlands-provinces.geojson')
      .then(r=>r.json())
      .then(data=>{provinces=data;neighbors=[];render();});
  });
}

window.addEventListener('resize',render);

modeBtn.addEventListener('click',()=>{
  const next=theme()==='night'?'day':'night';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tube-theme',next);
  render();
});

loadMap();
</script>
</body>
</html>
